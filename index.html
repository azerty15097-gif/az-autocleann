<!DOCTYPE html>
<html lang="fr" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AZ-AutoClean | Gestion Pro & Caisse</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- jsQR for Barcode / QR Code scanning -->
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 h-full flex flex-col selection:bg-amber-500 selection:text-slate-950">

    <!-- CONTENEUR PRINCIPAL DE L'APPLICATION -->
    <div id="app" class="flex-1 flex flex-col h-full max-w-md mx-auto w-full bg-slate-900 shadow-2xl relative overflow-hidden border-x border-slate-800">
        <!-- Rendu dynamique géré par JavaScript -->
    </div>

    <!-- SCRIPT DE L'APPLICATION -->
    <script>
        // --- ÉTAT GLOBAL DE L'APPLICATION & DONNÉES LOCALES ---
        let appState = {
            currentUser: null, // { name, role: 'admin'|'cashier', pin }
            currentTab: 'plates', // 'plates' ou 'products'
            vehicles: JSON.parse(localStorage.getItem('az_vehicles')) || [
                { id: 1, plate: '01234-116-16', brand: 'Renault Clio V', owner: 'Karim B.', km: 45200, nextVidange: 50000, status: 'Actif', lastWash: '12/11/2026' },
                { id: 2, plate: '09876-108-31', brand: 'Peugeot 208', owner: 'Amine Z.', km: 78900, nextVidange: 80000, status: 'Urgent Vidange', lastWash: '01/10/2026' },
                { id: 3, plate: '05432-119-09', brand: 'Volkswagen Golf 7', owner: 'Sofiane H.', km: 31000, nextVidange: 40000, status: 'Actif', lastWash: '14/11/2026' }
            ],
            products: JSON.parse(localStorage.getItem('az_products')) || [
                { id: 'P001', name: 'Huile Moteur 5W40 Synthese', barcode: '6131000123456', price: 6500, stock: 14, category: 'Lubrifiant' },
                { id: 'P002', name: 'Filtre à Huile Purflux', barcode: '3285930128941', price: 1800, stock: 22, category: 'Filtre' },
                { id: 'P003', name: 'Shampoing Carrosserie Mousse', barcode: '6139998877665', price: 2500, stock: 8, category: 'Lavage' }
            ],
            activeScanMode: null // 'plate' ou 'product'
        };

        function saveToStorage() {
            localStorage.setItem('az_vehicles', JSON.stringify(appState.vehicles));
            localStorage.setItem('az_products', JSON.stringify(appState.products));
        }

        // --- COMPOSANT LOGO AZ LUXURY ---
        function renderAZLogo(size = 'normal') {
            const sizeClass = size === 'large' ? 'w-16 h-16 text-2xl' : 'w-10 h-10 text-lg';
            return `
                <div class="${sizeClass} rounded-2xl bg-gradient-to-br from-amber-400 via-amber-500 to-amber-700 flex items-center justify-center font-extrabold text-slate-950 shadow-lg shadow-amber-500/20 tracking-tighter border border-amber-300/40">
                    AZ
                </div>
            `;
        }

        // --- GESTIONNAIRE D'AFFICHAGE PRINCIPAL ---
        function render() {
            const appEl = document.getElementById('app');
            if (!appState.currentUser) {
                appEl.innerHTML = renderLoginScreen();
            } else {
                appEl.innerHTML = renderMainApp();
            }
        }

        // --- 1. ÉCRAN DE CONNEXION ---
        function renderLoginScreen() {
            return `
                <div class="flex-1 flex flex-col justify-between p-6 bg-gradient-to-b from-slate-900 via-slate-950 to-slate-950">
                    <div class="pt-12 text-center flex flex-col items-center">
                        <div class="mb-4 animate-bounce">${renderAZLogo('large')}</div>
                        <h1 class="text-3xl font-extrabold text-white tracking-tight">AZ-AutoClean</h1>
                        <p class="text-xs text-amber-400 font-medium tracking-widest uppercase mt-1">Car Wash & Maintenance Management</p>
                    </div>

                    <div class="space-y-4 my-auto">
                        <div class="bg-slate-900/80 border border-slate-800 rounded-2xl p-5 shadow-xl backdrop-blur-md">
                            <h2 class="text-sm font-semibold text-slate-300 mb-4 flex items-center gap-2">
                                <i class="fa-solid fa-lock text-amber-400"></i> Sélectionner un profil d'accès
                            </h2>
                            <div class="space-y-3">
                                <button onclick="loginAs('admin')" class="w-full text-left p-3.5 rounded-xl bg-slate-800/80 hover:bg-slate-800 border border-slate-700/60 transition-all flex items-center justify-between group">
                                    <div class="flex items-center gap-3">
                                        <div class="w-10 h-10 rounded-xl bg-amber-500/10 text-amber-400 flex items-center justify-center font-bold">A</div>
                                        <div>
                                            <div class="font-bold text-slate-100 group-hover:text-amber-400 transition-colors">Administrateur</div>
                                            <div class="text-xs text-slate-400">Accès complet & Gestion parc</div>
                                        </div>
                                    </div>
                                    <i class="fa-solid fa-chevron-right text-slate-500 group-hover:text-amber-400"></i>
                                </button>
                                <button onclick="loginAs('cashier')" class="w-full text-left p-3.5 rounded-xl bg-slate-800/80 hover:bg-slate-800 border border-slate-700/60 transition-all flex items-center justify-between group">
                                    <div class="flex items-center gap-3">
                                        <div class="w-10 h-10 rounded-xl bg-blue-500/10 text-blue-400 flex items-center justify-center font-bold">C</div>
                                        <div>
                                            <div class="font-bold text-slate-100 group-hover:text-blue-400 transition-colors">Caissier / Vente</div>
                                            <div class="text-xs text-slate-400">Scan & Encaissement (Restrictions client)</div>
                                        </div>
                                    </div>
                                    <i class="fa-solid fa-chevron-right text-slate-500 group-hover:text-blue-400"></i>
                                </button>
                            </div>
                        </div>
                    </div>

                    <div class="text-center text-xs text-slate-500 pb-4">
                        AZ-AutoClean v2.6 • Sécurisé PWA
                    </div>
                </div>
            `;
        }

        function loginAs(role) {
            if (role === 'admin') {
                appState.currentUser = { name: 'Karim Benali', role: 'admin' };
            } else {
                appState.currentUser = { name: 'Sofiane Hadj', role: 'cashier' };
            }
            render();
        }

        function logout() {
            appState.currentUser = null;
            render();
        }

        // --- 2. INTERFACE PRINCIPALE ---
        function renderMainApp() {
            return `
                <div class="flex-1 flex flex-col h-full overflow-hidden">
                    <!-- HEADER -->
                    <header class="px-5 py-4 bg-slate-900/90 border-b border-slate-800 flex items-center justify-between backdrop-blur-md sticky top-0 z-20">
                        <div class="flex items-center gap-3">
                            ${renderAZLogo()}
                            <div>
                                <h1 class="text-base font-bold text-white leading-tight">AZ-AutoClean</h1>
                                <span class="text-xs px-2 py-0.5 rounded-full ${appState.currentUser.role === 'admin' ? 'bg-amber-500/20 text-amber-400 border border-amber-500/30' : 'bg-blue-500/20 text-blue-400 border border-blue-500/30'}">
                                    ${appState.currentUser.role === 'admin' ? 'Admin: ' + appState.currentUser.name : 'Caissier: ' + appState.currentUser.name}
                                </span>
                            </div>
                        </div>
                        <div class="flex items-center gap-2">
                            <button onclick="openScanner('plate')" class="w-10 h-10 rounded-xl bg-slate-800 hover:bg-slate-700 text-amber-400 flex items-center justify-center border border-slate-700 transition" title="Scanner Plaque">
                                <i class="fa-solid fa-camera"></i>
                            </button>
                            <button onclick="logout()" class="w-10 h-10 rounded-xl bg-slate-800 hover:bg-red-900/40 text-slate-400 hover:text-red-400 flex items-center justify-center border border-slate-700 transition" title="Déconnexion">
                                <i class="fa-solid fa-power-off"></i>
                            </button>
                        </div>
                    </header>

                    <!-- CONTENU ONGLET ACTIF -->
                    <main class="flex-1 overflow-y-auto p-4 pb-24 hide-scrollbar">
                        ${appState.currentTab === 'plates' ? renderPlatesTab() : renderProductsTab()}
                    </main>

                    <!-- NAVIGATION DU BAS -->
                    <nav class="absolute bottom-0 left-0 right-0 bg-slate-900/95 border-t border-slate-800 px-6 py-3 flex items-center justify-around backdrop-blur-md z-20">
                        <button onclick="switchTab('plates')" class="flex flex-col items-center gap-1 transition-all ${appState.currentTab === 'plates' ? 'text-amber-400 scale-105' : 'text-slate-400 hover:text-slate-200'}">
                            <i class="fa-solid fa-car-side text-lg"></i>
                            <span class="text-xs font-semibold">Plaques & Véhicules</span>
                        </button>
                        <button onclick="switchTab('products')" class="flex flex-col items-center gap-1 transition-all ${appState.currentTab === 'products' ? 'text-amber-400 scale-105' : 'text-slate-400 hover:text-slate-200'}">
                            <i class="fa-solid fa-boxes-stacked text-lg"></i>
                            <span class="text-xs font-semibold">Produits & Scan</span>
                        </button>
                    </nav>

                    <!-- MODAL DE SCANNER CAMÉRA -->
                    <div id="scannerModal" class="hidden fixed inset-0 z-50 bg-slate-950/95 flex flex-col p-4">
                        <div class="flex items-center justify-between mb-4">
                            <h3 id="scannerTitle" class="text-lg font-bold text-white flex items-center gap-2">
                                <i class="fa-solid fa-camera text-amber-400"></i> Scanner Caméra
                            </h3>
                            <button onclick="closeScanner()" class="w-10 h-10 rounded-xl bg-slate-800 text-slate-300 hover:text-white flex items-center justify-center">
                                <i class="fa-solid fa-xmark text-lg"></i>
                            </button>
                        </div>
                        <div class="flex-1 relative rounded-2xl overflow-hidden bg-black border border-slate-800 flex items-center justify-center">
                            <video id="scannerVideo" autoplay playsinline muted class="absolute inset-0 w-full h-full object-cover"></video>
                            <canvas id="scannerCanvas" class="hidden"></canvas>
                            <!-- Viseur visuel -->
                            <div class="absolute inset-12 border-2 border-amber-400/80 rounded-2xl pointer-events-none flex items-center justify-center">
                                <div class="w-full h-0.5 bg-red-500/60 animate-pulse"></div>
                            </div>
                            <div class="absolute bottom-6 left-0 right-0 text-center px-4">
                                <p id="scannerInstruction" class="text-xs bg-slate-900/80 text-amber-300 py-2 px-4 rounded-xl border border-slate-700/80 backdrop-blur-md inline-block">
                                    Alignez l'élément dans le cadre
                                </p>
                            </div>
                        </div>
                        <div class="mt-4 flex gap-3">
                            <button onclick="triggerManualCapture()" class="flex-1 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-3.5 rounded-xl shadow-lg transition">
                                <i class="fa-solid fa-camera-rotate mr-2"></i> Capturer / Valider
                            </button>
                            <button onclick="closeScanner()" class="px-5 bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold rounded-xl transition">
                                Annuler
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        function switchTab(tab) {
            appState.currentTab = tab;
            render();
        }

        // --- ONGLET 1 : PLAQUES & VÉHICULES ---
        function renderPlatesTab() {
            return `
                <div class="space-y-5">
                    <div class="flex items-center justify-between">
                        <div>
                            <h2 class="text-lg font-bold text-white">Parc & Plaques</h2>
                            <p class="text-xs text-slate-400">Suivi des véhicules et kilométrage vidange</p>
                        </div>
                        ${appState.currentUser.role === 'admin' ? `
                            <button onclick="openAddVehicleModal()" class="bg-amber-500 hover:bg-amber-400 text-slate-950 text-xs font-bold px-3.5 py-2.5 rounded-xl shadow-md transition flex items-center gap-1.5">
                                <i class="fa-solid fa-plus"></i> Nouveau Véhicule
                            </button>
                        ` : ''}
                    </div>

                    <!-- Barre de recherche plaques -->
                    <div class="relative">
                        <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3.5 text-slate-500"></i>
                        <input type="text" id="plateSearchInput" oninput="filterPlates(this.value)" placeholder="Rechercher par plaque, propriétaire..." class="w-full bg-slate-900 border border-slate-800 rounded-xl pl-10 pr-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-amber-500">
                    </div>

                    <!-- Liste des véhicules -->
                    <div id="vehiclesList" class="space-y-3">
                        ${appState.vehicles.map(v => `
                            <div class="bg-slate-900/80 border border-slate-800 rounded-2xl p-4 shadow-lg">
                                <div class="flex items-start justify-between mb-3">
                                    <div>
                                        <span class="text-xs px-2.5 py-1 rounded-lg bg-amber-500/10 text-amber-400 font-mono font-bold border border-amber-500/20">${v.plate}</span>
                                        <h3 class="text-sm font-bold text-white mt-2">${v.brand}</h3>
                                        <p class="text-xs text-slate-400"><i class="fa-solid fa-user mr-1 text-slate-500"></i> ${v.owner}</p>
                                    </div>
                                    <span class="text-xs px-2.5 py-1 rounded-full ${v.status === 'Actif' ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' : 'bg-rose-500/20 text-rose-400 border border-rose-500/30'}">
                                        ${v.status}
                                    </span>
                                </div>
                                <div class="grid grid-cols-2 gap-2 bg-slate-950/60 p-3 rounded-xl border border-slate-800/80 text-xs">
                                    <div>
                                        <span class="text-slate-500 block">Kilométrage actuel</span>
                                        <span class="font-bold text-slate-200">${v.km.toLocaleString()} km</span>
                                    </div>
                                    <div>
                                        <span class="text-slate-500 block">Prochaine Vidange</span>
                                        <span class="font-bold text-amber-400">${v.nextVidange.toLocaleString()} km</span>
                                    </div>
                                </div>
                                ${appState.currentUser.role === 'admin' ? `
                                    <div class="mt-3 pt-3 border-t border-slate-800/80 flex justify-end gap-2">
                                        <button onclick="editVehicleKm(${v.id})" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg transition">
                                            <i class="fa-solid fa-gauge mr-1 text-amber-400"></i> Màj KM
                                        </button>
                                        <button onclick="deleteVehicle(${v.id})" class="text-xs bg-red-950/40 hover:bg-red-900/50 text-red-400 px-3 py-1.5 rounded-lg transition">
                                            <i class="fa-solid fa-trash"></i>
                                        </button>
                                    </div>
                                ` : ''}
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        // --- ONGLET 2 : PRODUITS & SCAN ---
        function renderProductsTab() {
            return `
                <div class="space-y-5">
                    <div class="flex items-center justify-between">
                        <div>
                            <h2 class="text-lg font-bold text-white">Inventaire & Produits</h2>
                            <p class="text-xs text-slate-400">Gestion des stocks et scan code-barres</p>
                        </div>
                        <button onclick="openScanner('product')" class="bg-amber-500 hover:bg-amber-400 text-slate-950 text-xs font-bold px-3.5 py-2.5 rounded-xl shadow-md transition flex items-center gap-1.5">
                            <i class="fa-solid fa-barcode"></i> Scanner Produit
                        </button>
                    </div>

                    <!-- Liste des produits -->
                    <div class="space-y-3">
                        ${appState.products.map(p => `
                            <div class="bg-slate-900/80 border border-slate-800 rounded-2xl p-4 shadow-lg flex items-center justify-between">
                                <div>
                                    <div class="flex items-center gap-2 mb-1">
                                        <span class="text-xs px-2 py-0.5 rounded bg-slate-800 text-amber-400 font-mono">${p.id}</span>
                                        <span class="text-xs text-slate-400">${p.category}</span>
                                    </div>
                                    <h3 class="text-sm font-bold text-white">${p.name}</h3>
                                    <p class="text-xs text-slate-500 font-mono mt-0.5">Code: ${p.barcode}</p>
                                </div>
                                <div class="text-right">
                                    <div class="text-sm font-extrabold text-amber-400">${p.price.toLocaleString()} DA</div>
                                    <div class="text-xs text-slate-400 mt-1">Stock: <span class="font-bold text-white">${p.stock}</span></div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        // --- GESTION CAMÉRA & SCANNER ---
        let videoStream = null;
        let scanInterval = null;

        function openScanner(mode) {
            appState.activeScanMode = mode;
            const modal = document.getElementById('scannerModal');
            const title = document.getElementById('scannerTitle');
            const instruction = document.getElementById('scannerInstruction');
            
            if (mode === 'plate') {
                title.innerHTML = `<i class="fa-solid fa-car-side text-amber-400"></i> Scan Plaque d'Immatriculation`;
                instruction.innerText = `Pointez la caméra vers la plaque du véhicule`;
            } else {
                title.innerHTML = `<i class="fa-solid fa-barcode text-amber-400"></i> Scan Code-barres / QR`;
                instruction.innerText = `Alignez le code-barres dans le cadre`;
            }

            modal.classList.remove('hidden');

            navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
                .then(stream => {
                    videoStream = stream;
                    const video = document.getElementById('scannerVideo');
                    video.srcObject = stream;
                    video.play();
                    scanInterval = setInterval(processFrame, 500);
                })
                .catch(err => {
                    alert("Erreur d'accès à la caméra : " + err.message);
                    closeScanner();
                });
        }

        function closeScanner() {
            if (videoStream) {
                videoStream.getTracks().forEach(track => track.stop());
                videoStream = null;
            }
            if (scanInterval) {
                clearInterval(scanInterval);
                scanInterval = null;
            }
            document.getElementById('scannerModal').classList.add('hidden');
        }

        function processFrame() {
            const video = document.getElementById('scannerVideo');
            const canvas = document.getElementById('scannerCanvas');
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                if (appState.activeScanMode === 'product') {
                    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    const code = jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts: 'dontInvert' });
                    if (code) {
                        handleSuccessfulScan('product', code.data);
                    }
                }
            }
        }

        function triggerManualCapture() {
            if (appState.activeScanMode === 'plate') {
                // Simulation instantanée de reconnaissance plaque
                const samplePlates = ['01234-116-16', '09876-108-31', '05432-119-09', '02211-112-25'];
                const detected = samplePlates[Math.floor(Math.random() * samplePlates.length)];
                handleSuccessfulScan('plate', detected);
            } else {
                // Simulation produit
                const sampleProds = appState.products;
                const prod = sampleProds[Math.floor(Math.random() * sampleProds.length)];
                handleSuccessfulScan('product', prod.barcode);
            }
        }

        function handleSuccessfulScan(type, data) {
            closeScanner();
            if (type === 'plate') {
                const found = appState.vehicles.find(v => v.plate.includes(data));
                if (found) {
                    alert(`Véhicule reconnu !\nPlaque : ${found.plate}\nMarque : ${found.brand}\nPropriétaire : ${found.owner}\nKilométrage : ${found.km} km`);
                } else {
                    if (appState.currentUser.role === 'admin') {
                        if (confirm(`Plaque ${data} non trouvée. Voulez-vous créer un nouveau véhicule ?`)) {
                            appState.vehicles.unshift({
                                id: Date.now(),
                                plate: data,
                                brand: 'Véhicule Scanné',
                                owner: 'Client Direct',
                                km: 10000,
                                nextVidange: 20000,
                                status: 'Actif',
                                lastWash: new Date().toLocaleDateString()
                            });
                            saveToStorage();
                            render();
                        }
                    } else {
                        alert(`Plaque ${data} non enregistrée. (Accès restreint : Seul l'administrateur peut créer un nouveau client).`);
                    }
                }
            } else {
                const foundProd = appState.products.find(p => p.barcode === data);
                if (foundProd) {
                    alert(`Produit trouvé : ${foundProd.name}\nPrix : ${foundProd.price} DA\nStock disponible : ${foundProd.stock}`);
                } else {
                    alert(`Code-barres scanné : ${data} (Aucun produit correspondant dans l'inventaire)`);
                }
            }
        }

        // --- ACTIONS ADMIN (Véhicules) ---
        function openAddVehicleModal() {
            const plate = prompt("Entrez le numéro de plaque (ex: 01234-116-16) :");
            if (!plate) return;
            const brand = prompt("Modèle / Marque du véhicule :");
            const owner = prompt("Nom du propriétaire :");
            const km = parseInt(prompt("Kilométrage actuel :") || "0");

            appState.vehicles.unshift({
                id: Date.now(),
                plate: plate,
                brand: brand || 'Véhicule',
                owner: owner || 'Client',
                km: km,
                nextVidange: km + 10000,
                status: 'Actif',
                lastWash: new Date().toLocaleDateString()
            });
            saveToStorage();
            render();
        }

        function editVehicleKm(id) {
            const v = appState.vehicles.find(item => item.id === id);
            if (!v) return;
            const newKm = prompt(`Modifier le kilométrage pour ${v.plate} :`, v.km);
            if (newKm !== null) {
                v.km = parseInt(newKm) || v.km;
                if (v.km >= v.nextVidange) {
                    v.status = 'Urgent Vidange';
                } else {
                    v.status = 'Actif';
                }
                saveToStorage();
                render();
            }
        }

        function deleteVehicle(id) {
            if (confirm("Voulez-vous supprimer ce véhicule du parc ?")) {
                appState.vehicles = appState.vehicles.filter(v => v.id !== id);
                saveToStorage();
                render();
            }
        }

        function filterPlates(query) {
            // Filtrage dynamique simple de la liste
            const q = query.toLowerCase();
            const cards = document.querySelectorAll('#vehiclesList > div');
            cards.forEach(card => {
                const text = card.innerText.toLowerCase();
                card.style.display = text.includes(q) ? 'block' : 'none';
            });
        }

        // --- INITIALISATION ---
        render();
    </script>
</body>
</html>
