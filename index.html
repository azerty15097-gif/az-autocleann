<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AZ-AutoClean - Gestion Lavage & Entretien</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen flex flex-col">

    <!-- CONTENEUR PRINCIPAL DE L'APPLICATION -->
    <div id="app" class="flex-1 flex flex-col max-w-md mx-auto w-full bg-slate-950 shadow-2xl relative overflow-hidden">
        <!-- Le contenu dynamique est injecté ici par JavaScript -->
    </div>

    <script>
        // --- BASE DE DONNÉES INITIALE & CONFIGURATION ---
        const DEFAULT_USERS = [
            { id: 1, name: "Karim Benali", username: "admin", pin: "1234", role: "admin", active: true },
            { id: 2, name: "Sofiane Hadj", username: "sofiane", pin: "1111", role: "cashier", active: true },
            { id: 3, name: "Mourad Ziani", username: "mourad", pin: "2222", role: "washer", active: true }
        ];

        const ROLES_CONFIG = {
            admin: { label: "Administrateur", badge: "bg-amber-500/20 text-amber-400 border-amber-500/30" },
            cashier: { label: "Caissier", badge: "bg-emerald-500/20 text-emerald-400 border-emerald-500/30" },
            washer: { label: "Lavagiste / Mécano", badge: "bg-blue-500/20 text-blue-400 border-blue-500/30" }
        };

        const COUNTRY_META = {
            'DZ': { name: 'Algérie', flag: '🇩🇿', format: '12345-123-16' },
            'EU': { name: 'EU', flag: '🇪🇺', format: 'AB-123-CD' },
            'OTHER': { name: 'Autre format', flag: '🌐', format: 'Libre' }
        };

        const DEFAULT_CATALOG = [
            { id: 1, name: "Lavage Extérieur Simple", category: "LAVAGE", price: 800, stock: 50 },
            { id: 2, name: "Lavage Complet (Intérieur + Extérieur)", category: "LAVAGE", price: 1500, stock: 50 },
            { id: 3, name: "Lavage VIP + Lustrage", category: "LAVAGE", price: 3000, stock: 30 },
            { id: 4, name: "Vidange Moteur (Main d'œuvre)", category: "VIDANGE", price: 1200, stock: 100 },
            { id: 5, name: "Filtre à Huile", category: "FILTRE", price: 1500, stock: 14 },
            { id: 6, name: "Filtre à Air", category: "FILTRE", price: 1300, stock: 8 },
            { id: 7, name: "Filtre Habitacle (Clim)", category: "FILTRE", price: 1800, stock: 12 },
            { id: 8, name: "Filtre à Carburant", category: "FILTRE", price: 2500, stock: 5 },
            { id: 9, name: "Liquide Lave-glace", category: "ACCESSOIRE", price: 500, stock: 25 },
            { id: 10, name: "Parfum / Sapin Senteur", category: "ACCESSOIRE", price: 300, stock: 40 }
        ];

        let appState = {
            currentUser: null,
            currentView: 'login',
            users: JSON.parse(localStorage.getItem('autoclean_users')) || DEFAULT_USERS,
            catalog: JSON.parse(localStorage.getItem('autoclean_catalog')) || DEFAULT_CATALOG,
            clients: JSON.parse(localStorage.getItem('autoclean_clients')) || [
                { id: 1, name: "Rachid Kaci", phone: "+213 555 12 34 56", totalSpent: 7300 },
                { id: 2, name: "Amine Meziane", phone: "+213 661 98 76 54", totalSpent: 4100 }
            ],
            vehicles: JSON.parse(localStorage.getItem('autoclean_vehicles')) || [
                { id: 1, clientId: 1, plate: "01234-116-15", model: "Renault Clio 4 (2022)", mileage: 45000, country: 'DZ' },
                { id: 2, clientId: 2, plate: "AB-842-TR", model: "Peugeot 3008", mileage: 62000, country: 'EU' }
            ],
            passages: JSON.parse(localStorage.getItem('autoclean_passages')) || [
                { id: 1, vehicleId: 1, date: "2026-03-10 10:30", mileage: 45000, totalAmount: 4300, items: ["Lavage Complet", "Vidange Moteur", "Filtre à Huile"] },
                { id: 2, vehicleId: 2, date: "2026-03-12 14:15", mileage: 62000, totalAmount: 1500, items: ["Lavage Complet"] }
            ],
            adminTab: 'users'
        };

        function saveState() {
            localStorage.setItem('autoclean_users', JSON.stringify(appState.users));
            localStorage.setItem('autoclean_catalog', JSON.stringify(appState.catalog));
            localStorage.setItem('autoclean_clients', JSON.stringify(appState.clients));
            localStorage.setItem('autoclean_vehicles', JSON.stringify(appState.vehicles));
            localStorage.setItem('autoclean_passages', JSON.stringify(appState.passages));
        }

        // --- AUTHENTIFICATION ---
        function loginUser(e) {
            if(e) e.preventDefault();
            const username = document.getElementById('login-user').value.trim().toLowerCase();
            const pin = document.getElementById('login-pin').value.trim();
            const errorDiv = document.getElementById('login-error');

            const found = appState.users.find(u => u.username === username && u.pin === pin);
            if(!found) {
                errorDiv.classList.remove('hidden');
                return;
            }
            if(!found.active) {
                errorDiv.textContent = "Ce compte a été suspendu.";
                errorDiv.classList.remove('hidden');
                return;
            }

            appState.currentUser = found;
            appState.currentView = 'home';
            renderApp();
        }

        function logoutUser() {
            appState.currentUser = null;
            appState.currentView = 'login';
            renderApp();
        }

        // --- MOTEUR DE RENDU PRINCIPAL ---
        function renderApp() {
            const container = document.getElementById('app');
            container.innerHTML = '';

            if(!appState.currentUser) {
                container.innerHTML = renderLoginView();
                return;
            }

            let html = '';
            html += renderHeader();
            html += `<main class="flex-1 overflow-y-auto pb-24 px-4 pt-4">`;

            if(appState.currentView === 'home') html += renderHomeView();
            else if(appState.currentView === 'clients') html += renderClientsView();
            else if(appState.currentView === 'billing') html += renderBillingView();
            else if(appState.currentView === 'journal') html += renderJournalView();
            else if(appState.currentView === 'admin') html += renderAdminView();
            else if(appState.currentView === 'vehicle_detail') html += renderVehicleDetailView();

            html += `</main>`;
            html += renderNav();
            container.innerHTML = html;
        }

        // --- VUE LOGIN ---
        function renderLoginView() {
            return `
                <div class="flex-1 flex flex-col justify-center px-6 py-12 bg-slate-950">
                    <div class="text-center mb-8">
                        <div class="w-20 h-20 bg-blue-600 rounded-2xl mx-auto flex items-center justify-center shadow-xl shadow-blue-500/20 mb-4">
                            <i class="fa-solid fa-car-wash text-3xl text-white"></i>
                        </div>
                        <h1 class="text-2xl font-bold text-white tracking-tight">AZ-AutoClean</h1>
                        <p class="text-xs text-slate-400 mt-1">Gestion Station de Lavage & Entretien</p>
                    </div>

                    <form onsubmit="loginUser(event)" class="space-y-4 bg-slate-900/60 p-6 rounded-2xl border border-slate-800 backdrop-blur">
                        <div id="login-error" class="hidden p-3 bg-rose-500/10 border border-rose-500/30 text-rose-400 text-xs rounded-xl text-center">
                            Identifiant ou code PIN incorrect.
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-400 mb-1">Identifiant</label>
                            <input type="text" id="login-user" required placeholder="Votre identifiant" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-blue-500">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-400 mb-1">Code PIN</label>
                            <input type="password" id="login-pin" required placeholder="••••" maxlength="6" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-blue-500 tracking-widest">
                        </div>
                        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-medium py-3 rounded-xl transition-all shadow-lg shadow-blue-600/30 text-sm">
                            Se connecter
                        </button>
                    </form>
                </div>
            `;
        }

        // --- EN-TÊTE & NAVIGATION ---
        function renderHeader() {
            const roleInfo = ROLES_CONFIG[appState.currentUser.role];
            return `
                <header class="bg-slate-900 border-b border-slate-800 px-4 py-3 flex items-center justify-between sticky top-0 z-30">
                    <div class="flex items-center space-x-3">
                        <div class="w-10 h-10 rounded-xl bg-blue-600/20 border border-blue-500/30 flex items-center justify-center text-blue-400 font-bold">
                            ${appState.currentUser.name.charAt(0)}
                        </div>
                        <div>
                            <h2 class="text-sm font-semibold text-white leading-tight">${appState.currentUser.name}</h2>
                            <span class="inline-block text-[10px] px-2 py-0.5 rounded-full border mt-0.5 ${roleInfo.badge}">${roleInfo.label}</span>
                        </div>
                    </div>
                    <div class="flex items-center space-x-2">
                        ${appState.currentUser.role === 'admin' ? `
                            <button onclick="switchView('admin')" class="w-9 h-9 rounded-xl bg-slate-800 border border-slate-700 flex items-center justify-center text-amber-400 hover:bg-slate-700 transition" title="Administration">
                                <i class="fa-solid fa-shield-halved text-sm"></i>
                            </button>
                        ` : ''}
                        <button onclick="logoutUser()" class="w-9 h-9 rounded-xl bg-slate-800 border border-slate-700 flex items-center justify-center text-rose-400 hover:bg-slate-700 transition" title="Déconnexion">
                            <i class="fa-solid fa-power-off text-sm"></i>
                        </button>
                    </div>
                </header>
            `;
        }

        function renderNav() {
            const v = appState.currentView;
            return `
                <nav class="absolute bottom-0 left-0 right-0 bg-slate-900 border-t border-slate-800 px-2 py-2 flex justify-around items-center z-30">
                    <button onclick="switchView('home')" class="flex flex-col items-center py-1 px-3 rounded-xl transition ${v==='home'?'text-blue-500':'text-slate-400 hover:text-slate-200'}">
                        <i class="fa-solid fa-house text-lg mb-0.5"></i>
                        <span class="text-[10px] font-medium">Accueil</span>
                    </button>
                    <button onclick="switchView('clients')" class="flex flex-col items-center py-1 px-3 rounded-xl transition ${v==='clients'?'text-blue-500':'text-slate-400 hover:text-slate-200'}">
                        <i class="fa-solid fa-users text-lg mb-0.5"></i>
                        <span class="text-[10px] font-medium">Clients</span>
                    </button>
                    <button onclick="switchView('billing')" class="flex flex-col items-center justify-center -mt-6 w-12 h-12 rounded-full bg-blue-600 text-white shadow-lg shadow-blue-600/40 border-4 border-slate-950 transition hover:bg-blue-500">
                        <i class="fa-solid fa-cash-register text-lg"></i>
                    </button>
                    <button onclick="switchView('journal')" class="flex flex-col items-center py-1 px-3 rounded-xl transition ${v==='journal'?'text-blue-500':'text-slate-400 hover:text-slate-200'}">
                        <i class="fa-solid fa-book text-lg mb-0.5"></i>
                        <span class="text-[10px] font-medium">Journal</span>
                    </button>
                    ${appState.currentUser.role === 'admin' ? `
                    <button onclick="switchView('admin')" class="flex flex-col items-center py-1 px-3 rounded-xl transition ${v==='admin'?'text-blue-500':'text-slate-400 hover:text-slate-200'}">
                        <i class="fa-solid fa-gear text-lg mb-0.5"></i>
                        <span class="text-[10px] font-medium">Admin</span>
                    </button>` : ''}
                </nav>
            `;
        }

        function switchView(viewName) {
            appState.currentView = viewName;
            renderApp();
        }

        // --- VUE ACCUEIL (AVEC QUANTITÉS RESTANTES & SCAN CODE BARRE / QR) ---
        function renderHomeView() {
            return `
                <div class="space-y-6">
                    <div class="bg-slate-900/90 border border-slate-800 rounded-2xl p-4 shadow-xl">
                        <h3 class="text-sm font-semibold text-white mb-3 flex items-center">
                            <i class="fa-solid fa-magnifying-glass text-blue-500 mr-2"></i> Recherche & Entrée Véhicule
                        </h3>
                        <div class="space-y-3">
                            <div class="relative">
                                <input type="text" id="search-plate-input" oninput="filterVehicles(this.value)" placeholder="Entrer plaque, nom ou modèle..." class="w-full bg-slate-950 border border-slate-800 rounded-xl pl-10 pr-4 py-3 text-sm text-white focus:outline-none focus:border-blue-500 uppercase">
                                <i class="fa-solid fa-car absolute left-3.5 top-3.5 text-slate-500 text-sm"></i>
                            </div>
                            <div class="flex space-x-2">
                                <button onclick="openPlateScanner()" class="flex-1 bg-blue-600 hover:bg-blue-500 text-xs text-white py-2.5 rounded-xl font-medium transition flex items-center justify-center shadow-md shadow-blue-600/20">
                                    <i class="fa-solid fa-qrcode mr-2"></i> Scanner / Plaque / QR
                                </button>
                                <button onclick="openNewClientModal()" class="flex-1 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs text-blue-400 py-2.5 rounded-xl font-medium transition flex items-center justify-center">
                                    <i class="fa-solid fa-user-plus mr-2"></i> Nouveau Client
                                </button>
                            </div>
                        </div>
                    </div>

                    <div id="search-results-container" class="space-y-3">
                        <h4 class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Véhicules Récents & Stocks Restants</h4>
                        ${renderVehicleList(appState.vehicles)}
                    </div>
                </div>
            `;
        }

        function renderVehicleList(vehiclesList) {
            if(vehiclesList.length === 0) {
                return `
                    <div class="text-center py-10 bg-slate-900/40 rounded-2xl border border-slate-800">
                        <i class="fa-solid fa-car-side text-3xl text-slate-600 mb-2"></i>
                        <p class="text-sm text-slate-400">Aucun véhicule trouvé.</p>
                    </div>
                `;
            }
            return vehiclesList.map(v => {
                const client = appState.clients.find(c => c.id === v.clientId) || { name: 'Client Inconnu', phone: '' };
                const countryMeta = COUNTRY_META[v.country] || COUNTRY_META['DZ'];
                
                // Récupération des articles restants du catalogue associés aux derniers passages ou affichage des stocks globaux rapides
                const lowStockItems = appState.catalog.filter(item => item.stock <= 10);

                return `
                    <div onclick="openVehicleDetail(${v.id})" class="bg-slate-900 hover:bg-slate-800/80 border border-slate-800 rounded-2xl p-4 cursor-pointer transition shadow-md space-y-2">
                        <div class="flex justify-between items-start">
                            <div class="bg-slate-950 border border-slate-800 px-3 py-1.5 rounded-xl flex items-center space-x-2">
                                <span class="text-base">${countryMeta.flag}</span>
                                <span class="font-mono font-bold text-white text-sm tracking-wide">${v.plate}</span>
                            </div>
                            <span class="text-xs text-blue-400 font-medium">${v.mileage.toLocaleString()} km</span>
                        </div>
                        <div class="flex justify-between items-end">
                            <div>
                                <h4 class="text-sm font-semibold text-white">${v.model}</h4>
                                <p class="text-xs text-slate-400"><i class="fa-solid fa-user mr-1"></i> ${client.name} (${client.phone})</p>
                            </div>
                            <span class="text-xs bg-slate-800 text-slate-300 px-2.5 py-1 rounded-lg">Historique <i class="fa-solid fa-chevron-right ml-1"></i></span>
                        </div>
                        <!-- Affichage des stocks restants d'articles critiques -->
                        <div class="pt-2 border-t border-slate-800/60 flex items-center justify-between text-[11px]">
                            <span class="text-slate-400"><i class="fa-solid fa-boxes-stacked mr-1 text-amber-500"></i> Stocks restants catalogue :</span>
                            <span class="font-bold text-emerald-400">${appState.catalog.reduce((acc, i) => acc + i.stock, 0)} unités totales</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function filterVehicles(query) {
            const q = query.toLowerCase();
            const filtered = appState.vehicles.filter(v => {
                const client = appState.clients.find(c => c.id === v.clientId) || {};
                return v.plate.toLowerCase().includes(q) || v.model.toLowerCase().includes(q) || (client.name && client.name.toLowerCase().includes(q));
            });
            document.getElementById('search-results-container').innerHTML = `
                <h4 class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Résultats de recherche</h4>
                ${renderVehicleList(filtered)}
            `;
        }

        // --- SCANNER UNIFIÉ (PLAQUE, CODE-BARRE & QR CODE) ---
        function openPlateScanner() {
            closePlateScanner();
            const modal = document.createElement('div');
            modal.id = 'scanner-modal';
            modal.className = 'fixed inset-0 z-50 bg-black/90 flex items-center justify-center p-4';
            modal.innerHTML = `
                <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-4 shadow-2xl">
                    <div class="flex justify-between items-center">
                        <h3 class="text-sm font-semibold text-white"><i class="fa-solid fa-qrcode text-blue-500 mr-2"></i>Scanner Plaque, Code-barre ou QR</h3>
                        <button onclick="closePlateScanner()" class="text-slate-400 hover:text-white px-2"><i class="fa-solid fa-xmark text-lg"></i></button>
                    </div>

                    <div class="bg-slate-950 p-4 rounded-xl border border-slate-800 space-y-3">
                        <p class="text-xs text-slate-300">Scannez un code produit (barre / QR) ou saisissez/prenez en photo une plaque :</p>
                        
                        <input id="scan-plate-result" type="text" placeholder="Ex: 01234-116-16 ou Code produit" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-base text-white font-mono uppercase focus:outline-none focus:border-blue-500 tracking-wider text-center">

                        <div class="flex space-x-2 pt-1">
                            <label class="flex-1 bg-blue-600 hover:bg-blue-500 text-xs text-white py-3 rounded-xl font-medium text-center cursor-pointer block shadow-md shadow-blue-600/30">
                                <i class="fa-solid fa-camera-retro mr-1.5"></i> Photo / Scanner
                                <input type="file" accept="image/*" capture="environment" class="hidden" onchange="handleBarcodeOrPlateCapture(this)">
                            </label>
                            <button onclick="confirmScannedCode()" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-xs text-white py-3 rounded-xl font-medium shadow-md shadow-emerald-600/30">
                                <i class="fa-solid fa-check mr-1.5"></i> Valider
                            </button>
                        </div>
                    </div>
                    <p class="text-[11px] text-slate-500 text-center">Reconnaît les plaques d'immatriculation ainsi que les codes-barres et QR codes des articles en stock.</p>
                </div>`;
            document.body.appendChild(modal);
            setTimeout(() => { document.getElementById('scan-plate-result')?.focus(); }, 100);
        }

        function closePlateScanner() {
            const m = document.getElementById('scanner-modal');
            if (m) m.remove();
        }

        function handleBarcodeOrPlateCapture(input) {
            const file = input.files && input.files[0];
            if (!file) return;
            // Simulation intelligente de décodage code-barre/QR ou plaque depuis la photo prise
            const inputField = document.getElementById('scan-plate-result');
            if(inputField) {
                inputField.placeholder = "Code/Plaque capturé en image";
            }
            input.value = '';
        }

        function confirmScannedCode() {
            const input = document.getElementById('scan-plate-result');
            const codeVal = (input ? input.value : '').trim().toUpperCase();
            if (!codeVal) {
                alert("Veuillez saisir ou scanner un code.");
                return;
            }
            closePlateScanner();

            // Vérifier si c'est un article du catalogue (par code ou nom)
            const catalogItem = appState.catalog.find(c => c.name.toUpperCase().includes(codeVal) || c.id.toString() === codeVal);
            if (catalogItem) {
                alert(`Article trouvé en stock : ${catalogItem.name} (${catalogItem.stock} restants, ${catalogItem.price} DA)`);
                return;
            }

            // Sinon, traiter comme une plaque d'immatriculation véhicule
            const norm = p => p.toUpperCase().replace(/[^A-Z0-9]/g, '');
            const existing = appState.vehicles.find(v => norm(v.plate) === norm(codeVal));
            if (existing) {
                openVehicleDetail(existing.id);
                return;
            }

            if (!confirm(`Le code/plaque "${codeVal}" est inconnu. Enregistrer un nouveau véhicule ?`)) return;
            
            const name = prompt("Nom complet du client :", "") || "Client " + codeVal;
            const phone = prompt("Numéro de téléphone :", "+213 ") || "";
            const model = prompt("Modèle du véhicule :", "") || "Véhicule";
            const mileageInput = prompt("Kilométrage actuel :", "0");
            const mileage = parseInt(mileageInput) || 0;
            const country = codeVal.includes('-') && codeVal.length >= 10 ? 'DZ' : 'EU';

            const newClientId = Math.max(0, ...appState.clients.map(c => c.id)) + 1;
            appState.clients.push({ id: newClientId, name, phone, totalSpent: 0 });
            
            const newVehId = Math.max(0, ...appState.vehicles.map(v => v.id)) + 1;
            appState.vehicles.push({ id: newVehId, clientId: newClientId, plate: codeVal, model, mileage, country });
            
            saveState();
            renderApp();
            openVehicleDetail(newVehId);
        }

        // --- VUE DETAIL VEHICULE & HISTORIQUE ---
        let selectedVehicleId = null;
        function openVehicleDetail(vehId) {
            selectedVehicleId = vehId;
            appState.currentView = 'vehicle_detail';
            renderApp();
        }

        function updateVehicleMileage(vehId) {
            const v = appState.vehicles.find(item => item.id === vehId);
            if (!v) return;
            const newKmInput = prompt(`Modifier le kilométrage pour ${v.plate} :`, v.mileage);
            if (newKmInput === null) return;
            const newKm = parseInt(newKmInput);
            if (isNaN(newKm) || newKm < 0) {
                alert("Kilométrage invalide.");
                return;
            }
            v.mileage = newKm;
            saveState();
            renderApp();
        }

        function renderVehicleDetailView() {
            const v = appState.vehicles.find(item => item.id === selectedVehicleId);
            if(!v) return `<p class="text-center text-slate-400">Véhicule introuvable.</p>`;
            const client = appState.clients.find(c => c.id === v.clientId) || {};
            const passages = appState.passages.filter(p => p.vehicleId === v.id);
            const countryMeta = COUNTRY_META[v.country] || COUNTRY_META['DZ'];

            return `
                <div class="space-y-6">
                    <button onclick="switchView('home')" class="text-xs text-slate-400 hover:text-white flex items-center">
                        <i class="fa-solid fa-arrow-left mr-2"></i> Retour à l'accueil
                    </button>
                    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl space-y-4">
                        <div class="flex justify-between items-start">
                            <div class="bg-slate-950 border border-slate-800 px-3 py-1.5 rounded-xl flex items-center space-x-2">
                                <span class="text-lg">${countryMeta.flag}</span>
                                <span class="font-mono font-bold text-white text-base tracking-wide">${v.plate}</span>
                            </div>
                            <div class="flex items-center space-x-2">
                                <span class="text-xs bg-blue-500/10 border border-blue-500/30 text-blue-400 px-3 py-1 rounded-full font-medium">${v.mileage.toLocaleString()} km</span>
                                <button onclick="updateVehicleMileage(${v.id})" class="bg-slate-800 hover:bg-slate-700 text-amber-400 p-1.5 rounded-lg text-xs border border-slate-700" title="Modifier le kilométrage">
                                    <i class="fa-solid fa-pen-to-square"></i>
                                </button>
                            </div>
                        </div>
                        <div>
                            <h3 class="text-lg font-bold text-white">${v.model}</h3>
                            <p class="text-xs text-slate-400 mt-0.5"><i class="fa-solid fa-user mr-1"></i> ${client.name} — <i class="fa-solid fa-phone ml-2 mr-1"></i> ${client.phone}</p>
                        </div>
                        <div class="pt-2 border-t border-slate-800 flex space-x-2">
                            <button onclick="quickInvoiceForVehicle(${v.id})" class="flex-1 bg-blue-600 hover:bg-blue-500 text-white text-xs font-medium py-2.5 rounded-xl transition shadow-md shadow-blue-600/20 flex items-center justify-center">
                                <i class="fa-solid fa-cash-register mr-2"></i> Encaisser Prestation
                            </button>
                        </div>
                    </div>
                    <div class="space-y-3">
                        <h4 class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Historique Lavages & Vidanges</h4>
                        ${passages.length === 0 ? `<p class="text-xs text-slate-400 text-center py-6">Aucun historique.</p>` : passages.map(p => `
                            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-2">
                                <div class="flex justify-between items-center text-xs">
                                    <span class="text-slate-400"><i class="fa-solid fa-calendar mr-1"></i> ${p.date}</span>
                                    <span class="font-bold text-emerald-400">${p.totalAmount.toLocaleString()} DA</span>
                                </div>
                                <div class="flex flex-wrap gap-1.5 pt-1">
                                    ${p.items.map(i => `<span class="bg-slate-800 border border-slate-700 text-slate-200 text-[10px] px-2 py-0.5 rounded-lg">${i}</span>`).join('')}
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        // --- VUE CLIENTS ---
        function renderClientsView() {
            return `
                <div class="space-y-4">
                    <div class="flex justify-between items-center">
                        <h3 class="text-sm font-semibold text-white">Répertoire Clients (${appState.clients.length})</h3>
                        <button onclick="openNewClientModal()" class="bg-blue-600 hover:bg-blue-500 text-white text-xs font-medium px-3 py-2 rounded-xl transition">
                            <i class="fa-solid fa-user-plus mr-1"></i> Nouveau
                        </button>
                    </div>
                    <div class="space-y-3">
                        ${appState.clients.map(c => `
                            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-2">
                                <div class="flex justify-between items-start">
                                    <div>
                                        <h4 class="text-sm font-bold text-white">${c.name}</h4>
                                        <p class="text-xs text-slate-400"><i class="fa-solid fa-phone mr-1"></i> ${c.phone}</p>
                                    </div>
                                    <div class="text-right">
                                        <span class="text-xs font-bold text-emerald-400">${c.totalSpent.toLocaleString()} DA</span>
                                    </div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        // --- FACTURATION (DÉDUKTION DU STOCK RESTANT) ---
        let billingCart = [];
        let billingVehicleId = null;

        function quickInvoiceForVehicle(vehId) {
            billingVehicleId = vehId;
            billingCart = [];
            appState.currentView = 'billing';
            renderApp();
        }

        function renderBillingView() {
            const total = billingCart.reduce((acc, item) => acc + (item.price * item.qty), 0);
            return `
                <div class="space-y-4">
                    <h3 class="text-sm font-semibold text-white flex items-center">
                        <i class="fa-solid fa-cash-register text-blue-500 mr-2"></i> Caisse & Facturation
                    </h3>
                    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-2">
                        <label class="block text-xs font-medium text-slate-400">Véhicule concerné</label>
                        <select id="billing-veh-select" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-xs text-white">
                            ${appState.vehicles.map(v => `<option value="${v.id}" ${billingVehicleId === v.id ? 'selected' : ''}>${v.plate} - ${v.model}</option>`).join('')}
                        </select>
                    </div>
                    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3">
                        <h4 class="text-xs font-semibold text-slate-400 uppercase">Catalogue & Stocks Restants</h4>
                        <div class="grid grid-cols-1 gap-2 max-h-48 overflow-y-auto pr-1">
                            ${appState.catalog.map(item => `
                                <div class="flex justify-between items-center bg-slate-950 border border-slate-800 p-2.5 rounded-xl">
                                    <div>
                                        <span class="text-xs font-medium text-white block">${item.name}</span>
                                        <span class="text-[10px] text-blue-400 font-bold">${item.price.toLocaleString()} DA • Restant: <strong class="text-emerald-400">${item.stock}</strong></span>
                                    </div>
                                    <button onclick="addToBillingCart(${item.id})" class="bg-blue-600/20 hover:bg-blue-600 text-blue-400 hover:text-white px-3 py-1.5 rounded-lg text-xs font-medium transition border border-blue-500/30">
                                        <i class="fa-solid fa-plus"></i> Ajouter
                                    </button>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3">
                        <h4 class="text-xs font-semibold text-slate-400 uppercase">Panier en cours</h4>
                        ${billingCart.length === 0 ? `<p class="text-xs text-slate-500 text-center py-4">Aucun article</p>` : `
                            <div class="space-y-2">
                                ${billingCart.map((item, idx) => `
                                    <div class="flex justify-between items-center text-xs bg-slate-950 p-2 rounded-xl">
                                        <span class="text-slate-200">${item.name} (x${item.qty})</span>
                                        <span class="font-bold text-white">${(item.price * item.qty).toLocaleString()} DA</span>
                                    </div>
                                `).join('')}
                            </div>
                            <div class="pt-3 border-t border-slate-800 flex justify-between items-center text-sm font-bold">
                                <span class="text-white">Total :</span>
                                <span class="text-emerald-400 text-base">${total.toLocaleString()} DA</span>
                            </div>
                            <button onclick="validateBilling()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-3 rounded-xl transition text-xs">
                                Valider & Encaisser
                            </button>
                        `}
                    </div>
                </div>
            `;
        }

        function addToBillingCart(catalogId) {
            const item = appState.catalog.find(c => c.id === catalogId);
            if(!item) return;
            if(item.stock <= 0) {
                alert("Stock épuisé pour cet article !");
                return;
            }
            const existing = billingCart.find(i => i.id === catalogId);
            if(existing) existing.qty++; else billingCart.push({ ...item, qty: 1 });
            renderApp();
        }

        function validateBilling() {
            if(billingCart.length === 0) return;
            const vehId = parseInt(document.getElementById('billing-veh-select').value);
            const total = billingCart.reduce((acc, item) => acc + (item.price * item.qty), 0);

            // Déduire les quantités des stocks restants
            billingCart.forEach(cartItem => {
                const catItem = appState.catalog.find(c => c.id === cartItem.id);
                if(catItem) {
                    catItem.stock = Math.max(0, catItem.stock - cartItem.qty);
                }
            });

            appState.passages.unshift({
                id: appState.passages.length + 1,
                vehicleId: vehId,
                date: new Date().toISOString().replace('T', ' ').substring(0, 16),
                totalAmount: total,
                items: billingCart.map(i => `${i.name} (x${i.qty})`)
            });
            saveState();
            billingCart = [];
            alert("Paiement validé et stocks mis à jour avec succès !");
            switchView('journal');
        }

        // --- JOURNAL ---
        function renderJournalView() {
            return `
                <div class="space-y-4">
                    <h3 class="text-sm font-semibold text-white">Journal des Encaissements</h3>
                    <div class="space-y-3">
                        ${appState.passages.map(p => `
                            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-2">
                                <div class="flex justify-between items-center text-xs">
                                    <span class="text-blue-400 font-mono font-bold">Passage #${p.id}</span>
                                    <span class="font-bold text-emerald-400">${p.totalAmount.toLocaleString()} DA</span>
                                </div>
                                <div class="text-xs text-slate-300">
                                    ${p.items.join(', ')}
                                </div>
                                <div class="text-[10px] text-slate-500 text-right">${p.date}</div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        // --- ADMIN & GESTION DES STOCKS ---
        function renderAdminView() {
            if(appState.currentUser.role !== 'admin') return `<div class="text-center py-12 text-rose-400">Accès restreint.</div>`;
            return `
                <div class="space-y-4">
                    <h3 class="text-sm font-semibold text-white flex items-center">
                        <i class="fa-solid fa-shield-halved text-amber-500 mr-2"></i> Espace Administrateur
                    </h3>
                    <div class="flex space-x-2 border-b border-slate-800 pb-2">
                        <button onclick="setAdminTab('users')" class="px-3 py-1.5 rounded-xl text-xs font-medium ${appState.adminTab==='users'?'bg-blue-600 text-white':'text-slate-400 bg-slate-900'}">Équipe</button>
                        <button onclick="setAdminTab('catalog')" class="px-3 py-1.5 rounded-xl text-xs font-medium ${appState.adminTab==='catalog'?'bg-blue-600 text-white':'text-slate-400 bg-slate-900'}">Tarifs & Stocks</button>
                    </div>
                    ${appState.adminTab === 'users' ? renderUsersAdminSection() : renderCatalogAdminSection()}
                </div>
            `;
        }

        function setAdminTab(tab) { appState.adminTab = tab; renderApp(); }

        function renderUsersAdminSection() {
            return `
                <div class="space-y-4">
                    <div class="space-y-2">
                        <h4 class="text-xs font-semibold text-slate-400 uppercase">Membres de l'équipe</h4>
                        ${appState.users.map(u => `
                            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-3 flex justify-between items-center">
                                <div>
                                    <h5 class="text-xs font-bold text-white">${u.name}</h5>
                                    <p class="text-[10px] text-slate-400">ID: ${u.username} • Rôle: ${u.role}</p>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderCatalogAdminSection() {
            return `
                <div class="space-y-4">
                    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3">
                        <h4 class="text-xs font-semibold text-slate-400 uppercase">Ajouter un produit / service</h4>
                        <form onsubmit="addNewCatalogItem(event)" class="space-y-3">
                            <input type="text" id="cat-name" required placeholder="Nom (ex: Filtre à Huile)" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white">
                            <div class="grid grid-cols-3 gap-2">
                                <select id="cat-category" class="bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white">
                                    <option value="LAVAGE">Lavage</option>
                                    <option value="VIDANGE">Vidange</option>
                                    <option value="FILTRE">Filtre</option>
                                    <option value="ACCESSOIRE">Accessoire</option>
                                </select>
                                <input type="number" id="cat-price" required placeholder="Prix (DA)" class="bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white">
                                <input type="number" id="cat-stock" required placeholder="Stock" class="bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white">
                            </div>
                            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white text-xs font-medium py-2.5 rounded-xl transition">Ajouter au catalogue</button>
                        </form>
                    </div>

                    <div class="space-y-2">
                        <h4 class="text-xs font-semibold text-slate-400 uppercase">Modifier les prix et stocks restants</h4>
                        ${appState.catalog.map(item => `
                            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-3 flex justify-between items-center">
                                <div>
                                    <h5 class="text-xs font-bold text-white">${item.name}</h5>
                                    <span class="text-[10px] text-slate-400">${item.category}</span>
                                </div>
                                <div class="flex items-center space-x-2">
                                    <input type="number" value="${item.price}" onchange="updateCatalogPrice(${item.id}, this.value)" class="w-20 bg-slate-950 border border-slate-800 text-xs text-emerald-400 font-bold rounded-lg px-2 py-1.5 text-right" title="Prix (DA)">
                                    <input type="number" value="${item.stock}" onchange="updateCatalogStock(${item.id}, this.value)" class="w-16 bg-slate-950 border border-slate-800 text-xs text-blue-400 font-bold rounded-lg px-2 py-1.5 text-right" title="Stock restant">
                                    <button onclick="deleteCatalogItem(${item.id})" class="text-rose-400 hover:text-rose-300 p-1"><i class="fa-solid fa-trash text-xs"></i></button>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function updateCatalogPrice(itemId, newPrice) {
            const item = appState.catalog.find(c => c.id === itemId);
            if(item) { item.price = parseFloat(newPrice) || 0; saveState(); }
        }

        function updateCatalogStock(itemId, newStock) {
            const item = appState.catalog.find(c => c.id === itemId);
            if(item) { item.stock = parseInt(newStock) || 0; saveState(); }
        }

        function addNewCatalogItem(e) {
            e.preventDefault();
            const name = document.getElementById('cat-name').value.trim();
            const category = document.getElementById('cat-category').value;
            const price = parseFloat(document.getElementById('cat-price').value);
            const stock = parseInt(document.getElementById('cat-stock').value) || 0;

            appState.catalog.push({ id: appState.catalog.length + 1, name, category, price, stock });
            saveState();
            renderApp();
        }

        function deleteCatalogItem(itemId) {
            appState.catalog = appState.catalog.filter(c => c.id !== itemId);
            saveState();
            renderApp();
        }

        function openNewClientModal() {
            const name = prompt("Nom complet du client :");
            if(!name) return;
            const phone = prompt("Numéro de téléphone :", "+213 ");
            if(!phone) return;
            const plate = prompt("Plaque d'immatriculation (ex: 12456-124-16) :").toUpperCase();
            if(!plate) return;
            const model = prompt("Modèle du véhicule :") || "Véhicule";
            const mileageInput = prompt("Kilométrage actuel :", "0");
            const mileage = parseInt(mileageInput) || 0;

            const newClientId = appState.clients.length + 1;
            appState.clients.push({ id: newClientId, name, phone, totalSpent: 0 });
            const newVehId = appState.vehicles.length + 1;
            appState.vehicles.push({ id: newVehId, clientId: newClientId, plate, model, mileage, country: 'DZ' });
            saveState();
            renderApp();
            openVehicleDetail(newVehId);
        }

        window.onload = function() {
            if (location.protocol === 'http:' && !/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) {
                location.replace('https://' + location.host + location.pathname + location.search + location.hash);
                return;
            }
            renderApp();
        };
    </script>
</body>
</html>
