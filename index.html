    body {

    .app-shell {
      max-width: 480px;
      margin: 0 auto;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 0 50px rgba(6, 182, 212, 0.12);
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    @keyframes scanLine {
      0%, 100% { top: 10%; opacity: 0.9; }
      50% { top: 88%; opacity: 1; }
    }
    .scanner-laser {
      position: absolute;
      left: 6%;
      right: 6%;
      height: 2px;
      background: linear-gradient(90deg, transparent, #22d3ee, #ffffff, #22d3ee, transparent);
      box-shadow: 0 0 12px #22d3ee, 0 0 24px #06b6d4;
      animation: scanLine 2.2s ease-in-out infinite;
    }
    .plate-dz {
      background: linear-gradient(180deg, #f8fafc 0%, #e2e8f0 100%);
      color: #0f172a;
      border: 2.5px solid #1e293b;
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: 0.08em;
    }
    .plate-eu {
      background: #ffffff;
      color: #0f172a;
      border: 2.5px solid #1e293b;
      font-family: 'JetBrains Mono', monospace;
      position: relative;
      padding-left: 22px;
    }
    .plate-eu::before {
      content: 'EU';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 18px;
      background: #1d4ed8;
      color: #fff;
      font-size: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
    }
    .plate-intl {
      background: #fef08a;
      color: #0f172a;
      border: 2.5px solid #1e293b;
      font-family: 'JetBrains Mono', monospace;
    }

      0%, 100% { transform: translateY(0px); }

    }
    .animate-float {
      animation: floatSlow 3.5s ease-in-out infinite;

    function stopCameraStream() {

      if (zxingReader) {
        try { zxingReader.reset(); } catch (e) {}

    async function startCameraInElement(videoElementId, fallbackOverlayId, mode = 'plate') {
      // Ne jamais conserver deux flux caméra simultanément.
      stopCameraStream();
      const videoEl = document.getElementById(videoElementId);
      const fallbackEl = document.getElementById(fallbackOverlayId);
      if (!videoEl) {
        showToast('Zone vidéo introuvable. Rechargez la page.', 'error');
        return;
      }

      // getUserMedia est bloqué par les navigateurs sur HTTP (sauf localhost).
      if (!window.isSecureContext || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        if (fallbackEl) fallbackEl.classList.remove('hidden');
        const msg = !window.isSecureContext
          ? 'Caméra bloquée : ouvrez AZ-LAVAGE en HTTPS (ou sur localhost). Une adresse HTTP avec IP LAN ne suffit pas.'
          : 'Caméra indisponible : vérifiez le navigateur et les autorisations caméra.';
        showToast(msg, 'error');
        console.error('[AZ-LAVAGE camera] Secure context:', window.isSecureContext,
          'mediaDevices:', !!navigator.mediaDevices);
        return;
      }

      try {
        // Attributs explicites requis notamment par Safari/iOS.
        videoEl.setAttribute('autoplay', '');
        videoEl.setAttribute('playsinline', '');
        videoEl.muted = true;
        videoEl.playsInline = true;

        let stream;
        try {
          stream = await navigator.mediaDevices.getUserMedia({
            audio: false,
            video: {
              facingMode: { ideal: 'environment' },
              width: { ideal: 1280 },
              height: { ideal: 720 }
            }
          });
        } catch (firstError) {
          // Certains appareils refusent les contraintes de résolution/facingMode.
          // On retente avec la configuration vidéo la plus simple.
          console.warn('[AZ-LAVAGE camera] Première tentative échouée:', firstError);
          stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
        }

        activeMediaStream = stream;
        videoEl.srcObject = stream;
        await new Promise((resolve, reject) => {
          if (videoEl.readyState >= 2) return resolve();
          const onReady = () => { cleanup(); resolve(); };
          const onError = () => { cleanup(); reject(new Error('Flux vidéo non lisible')); };
          const cleanup = () => {
            videoEl.removeEventListener('loadedmetadata', onReady);
            videoEl.removeEventListener('error', onError);
          };
          videoEl.addEventListener('loadedmetadata', onReady, { once: true });
          videoEl.addEventListener('error', onError, { once: true });
        });
        await videoEl.play();
        if (fallbackEl) fallbackEl.classList.add('hidden');

        if (mode === 'plate') {
          document.getElementById('btn-stop-plate-cam')?.classList.remove('hidden');
          document.getElementById('btn-capture-plate-ocr')?.classList.remove('hidden');
          showToast('Caméra prête : cadrez la plaque puis capturez-la.', 'success');
        } else if (mode === 'barcode') {
          document.getElementById('btn-stop-barcode-cam')?.classList.remove('hidden');
          document.getElementById('btn-capture-barcode')?.classList.remove('hidden');
          showToast('Caméra active : présentez le code-barres ou QR au centre.', 'success');
          startContinuousBarcodeDetection(videoEl);
        }
      } catch (err) {
        console.error('[AZ-LAVAGE camera] Erreur ouverture caméra:', err);
        if (activeMediaStream) {
          activeMediaStream.getTracks().forEach(track => track.stop());
          activeMediaStream = null;
        }
        videoEl.srcObject = null;
        if (fallbackEl) fallbackEl.classList.remove('hidden');
        let message = 'Impossible d’ouvrir la caméra.';
        if (err && (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError')) {
          message = 'Autorisation caméra refusée. Autorisez la caméra dans les paramètres du navigateur.';
        } else if (err && (err.name === 'NotFoundError' || err.name === 'DevicesNotFoundError')) {
          message = 'Aucune caméra détectée sur cet appareil.';
        } else if (err && (err.name === 'NotReadableError' || err.name === 'TrackStartError')) {
          message = 'Caméra déjà utilisée par une autre application. Fermez-la puis réessayez.';
        } else if (err && err.name === 'OverconstrainedError') {
          message = 'Caméra incompatible avec les paramètres demandés. Réessayez.';
        }
        showToast(message, 'error');
      }
    }

    // Lecture réelle en temps réel des Codes-Barres (EAN-13, Code-128, etc.) et QR Codes
    function startContinuousBarcodeDetection(videoEl) {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d', { willReadFrequently: true });

      // 1. Utiliser l'API native BarcodeDetector si supportée par le navigateur mobile
      let nativeDetector = null;
      if ('BarcodeDetector' in window) {
        try {
          const wantedFormats = [
            'qr_code', 'ean_13', 'ean_8', 'code_128',
            'code_39', 'upc_a', 'upc_e', 'itf'
          ];
          const supportedFormats = typeof window.BarcodeDetector.getSupportedFormats === 'function'
            ? wantedFormats.filter(format => window.BarcodeDetector.getSupportedFormats().includes(format))
            : wantedFormats;
          nativeDetector = new window.BarcodeDetector(
            supportedFormats.length ? { formats: supportedFormats } : undefined
          );
        } catch (e) {
          console.warn('[AZ-LAVAGE scanner] BarcodeDetector indisponible, essai ZXing.', e);
          nativeDetector = null;
        }
      }

      // 2. Fallback universel multi-format ZXing avec hints haute précision
      if (!nativeDetector && window.ZXing && window.ZXing.BrowserMultiFormatReader) {
        try {
          const hints = new Map();
          if (window.ZXing.DecodeHintType && window.ZXing.DecodeHintType.TRY_HARDER) {
            hints.set(window.ZXing.DecodeHintType.TRY_HARDER, true);
          }
          zxingReader = new window.ZXing.BrowserMultiFormatReader(hints);
        } catch (e) {
          zxingReader = null;
        }
      }

      let isBusy = false;
      barcodeScanInterval = setInterval(async () => {
        if (!activeMediaStream || isBusy || videoEl.readyState < 2) return;
        isBusy = true;

        try {
          let detectedValue = null;

          if (nativeDetector) {
            const barcodes = await nativeDetector.detect(videoEl);
            if (barcodes && barcodes.length > 0 && barcodes[0].rawValue) {
              detectedValue = barcodes[0].rawValue.trim();
            }
          }

          if (!detectedValue && zxingReader) {
            const vw = videoEl.videoWidth || 640;
            const vh = videoEl.videoHeight || 480;
            canvas.width = vw;
            canvas.height = vh;
            ctx.drawImage(videoEl, 0, 0, vw, vh);
            try {
              const luminanceSource = new window.ZXing.HTMLCanvasElementLuminanceSource(canvas);
              const binaryBitmap = new window.ZXing.BinaryBitmap(new window.ZXing.HybridBinarizer(luminanceSource));
              const result = zxingReader.decodeBitmap(binaryBitmap);
              if (result && result.getText()) {
                detectedValue = result.getText().trim();
              }
            } catch (notFoundErr) {
              // Aucun code dans cette frame, continuer
            }
          }

          if (detectedValue) {
            stopBarcodeCameraUI();
            if (navigator.vibrate) navigator.vibrate(120);
            showToast(`Code capté : ${detectedValue}`, 'success');
            processScannedBarcode(detectedValue);
          }
        } catch (err) {
          // Ignorer les erreurs ponctuelles d'analyse de frame
        } finally {
          isBusy = false;
        }
      }, 280);
    }

    // Capture manuelle instantanée d'une image de code-barres / QR si la détection auto tarde
    async function captureBarcodeSnapshot() {
      const videoEl = document.getElementById('barcode-camera-video');
      if (!videoEl || !activeMediaStream || videoEl.readyState < 2) {
        showToast('Activez d\'abord la caméra du scanner', 'warning');
        return;
      }

      const canvas = document.createElement('canvas');
      canvas.width = videoEl.videoWidth || 640;
      canvas.height = videoEl.videoHeight || 480;
      const ctx = canvas.getContext('2d');
      ctx.filter = 'contrast(135%)';
      ctx.drawImage(videoEl, 0, 0, canvas.width, canvas.height);

      let found = null;
      if ('BarcodeDetector' in window) {
        try {
          const detector = new window.BarcodeDetector();
          const res = await detector.detect(canvas);
          if (res && res.length > 0) found = res[0].rawValue.trim();
        } catch (e) {}
      }

      if (!found && window.ZXing && window.ZXing.BrowserMultiFormatReader) {
        try {
          const reader = new window.ZXing.BrowserMultiFormatReader();
          const lum = new window.ZXing.HTMLCanvasElementLuminanceSource(canvas);
          const bmp = new window.ZXing.BinaryBitmap(new window.ZXing.HybridBinarizer(lum));
          const res = reader.decodeBitmap(bmp);
          if (res && res.getText()) found = res.getText().trim();
        } catch (e) {}
      }

      if (found) {
        stopBarcodeCameraUI();
        if (navigator.vibrate) navigator.vibrate(120);
        showToast(`Code capté : ${found}`, 'success');
        processScannedBarcode(found);
      } else {
        showToast('Aucun code détecté : centrez bien le code-barres ou QR dans le cadre', 'warning');
      }
    }

    // Capture réelle & lecture OCR d'une plaque d'immatriculation via Tesseract.js
    async function captureAndReadPlateOCR() {
      const videoEl = document.getElementById('plate-camera-video');
      const statusBadge = document.getElementById('plate-ocr-status');
      if (!videoEl || !activeMediaStream || videoEl.readyState < 2) {
        showToast('Activez d\'abord la caméra pour lire une plaque', 'warning');
        return;
      }
      if (isScanningPlateNow) return;
      isScanningPlateNow = true;

      if (statusBadge) {
        statusBadge.textContent = 'Analyse OCR en cours...';
        statusBadge.classList.remove('hidden');
      }

      try {
        const vw = videoEl.videoWidth;
        const vh = videoEl.videoHeight;

        // Recadrer sur la zone centrale du viseur pour maximiser la précision OCR
        const cropW = Math.floor(vw * 0.78);
        const cropH = Math.floor(vh * 0.45);
        const cropX = Math.floor((vw - cropW) / 2);
        const cropY = Math.floor((vh - cropH) / 2);

        const canvas = document.createElement('canvas');
        canvas.width = cropW;
        canvas.height = cropH;
        const ctx = canvas.getContext('2d');
        ctx.filter = 'contrast(145%) grayscale(100%)';
        ctx.drawImage(videoEl, cropX, cropY, cropW, cropH, 0, 0, cropW, cropH);

        if (!window.Tesseract) {
          throw new Error('Moteur OCR non chargé');
        }

        const { data: { text } } = await window.Tesseract.recognize(canvas, 'eng', {
          tessedit_char_whitelist: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789- '
        });

        const cleanedLines = (text || '')
          .toUpperCase()
          .replace(/[^A-Z0-9-\s]/g, '')
          .split(/\n+/)
          .map(l => l.trim().replace(/\s+/g, '-'))
          .filter(l => l.length >= 5);

        // Rechercher un motif de plaque DZ (ex: 00482-123-16), EU (ex: AB-458-CD) ou suite alphanumérique
        let extractedPlate = cleanedLines.find(l => /\d{4,6}-\d{3}-\d{2}/.test(l) || /[A-Z]{2}-\d{3}-[A-Z]{2}/.test(l));
        if (!extractedPlate && cleanedLines.length > 0) {
          extractedPlate = cleanedLines.sort((a, b) => b.length - a.length)[0];
        }

        if (extractedPlate && extractedPlate.length >= 5) {
          if (navigator.vibrate) navigator.vibrate(120);
          stopPlateCameraUI();
          showToast(`Plaque lue par caméra : ${extractedPlate}`, 'success');
          processScannedPlate(extractedPlate);
        } else {
          showToast('Plaque illisible : rapprochez la caméra et réessayez', 'warning');
        }
      } catch (err) {
        showToast('Erreur lecture caméra : utilisez la saisie manuelle ou rapprochez la plaque', 'error');
      } finally {
        isScanningPlateNow = false;
        if (statusBadge) statusBadge.classList.add('hidden');
      }
    }

    // ============================================================================
    // DÉTECTION FORMAT DE PLAQUE (ALGÉRIE, EUROPE, INTERNATIONAL)
    // ============================================================================
    function detectPlateFormat(raw) {
      const clean = raw.trim().toUpperCase().replace(/\s+/g, '-');
      // Format Algérie : 00482-123-16 (5 chiffres - 3 chiffres - 2 chiffres wilaya)
      if (/^\d{4,6}-\d{3}-\d{2}$/.test(clean)) {
        return { formatted: clean, type: 'DZ', label: 'Algérie (DZ)' };
      }
      // Format Europe (SIV France / UE) : AB-458-CD
      if (/^[A-Z]{2}-\d{3}-[A-Z]{2}$/.test(clean) || /^[A-Z]{1,3}-[A-Z]{1,2}-\d{2,4}$/.test(clean)) {
        return { formatted: clean, type: 'EU', label: 'Europe (EU)' };
      }
      return { formatted: clean, type: 'INTL', label: 'International' };
    }

    // VUE 1 : ACCUEIL & SCANNER DE PLAQUES D'IMMATRICULATION (CAMÉRA EN VEILLE)

    function renderScanPlateView(container) {
      const todayIncome = db.transactions

                        <button onclick="checkoutQueueItem('${q.id}')" title="Encaisser" class="px-2.5 py-1.5 rounded-xl bg-cyan-600 text-white text-[10px] font-bold">

        <!-- Module Scanner de Plaque (Caméra en veille au démarrage) -->

          <!-- Zone Vidéo / Simulation Caméra -->

            <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar pt-1">
              <span class="text-[10px] text-slate-400 whitespace-nowrap font-semibold">Test rapide :</span>
              <button onclick="processScannedPlate('00482-123-16')" class="text-[10px] font-mono px-2 py-1 rounded bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-700 whitespace-nowrap hover:border-cyan-500">00482-123-16 (DZ)</button>
              <button onclick="processScannedPlate('AB-458-CD')" class="text-[10px] font-mono px-2 py-1 rounded bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-700 whitespace-nowrap hover:border-cyan-500">AB-458-CD (EU)</button>
              <button onclick="processScannedPlate('24510-125-06')" class="text-[10px] font-mono px-2 py-1 rounded bg-cyan-500/15 text-cyan-500 border border-cyan-500/30 whitespace-nowrap">+ Nouveau DZ</button>

        <!-- Saisie Manuelle Directe -->
        <div class="bg-white dark:bg-slateDark-900 p-4 rounded-3xl border border-slate-200 dark:border-slate-800 space-y-3">
          <label class="block text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider">

              class="flex-1 px-3.5 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 font-mono text-sm uppercase focus:outline-none focus:border-cyan-500" />
            <button type="submit" class="px-4 py-2.5 rounded-xl bg-slate-900 dark:bg-cyan-600 text-white font-bold text-xs hover:opacity-90 transition">
              Vérifier

        <!-- Derniers Véhicules Passés -->

            ${db.clients.slice(0, 3).map(c => renderClientSummaryCard(c)).join('')}

    }

    function openAddToQueueModal() {
      openModal('Placer un Véhicule sur Piste', `
        <form onsubmit="submitAddToQueue(event)" class="space-y-3">
          <div>
            <label class="block text-xs font-semibold mb-1">Véhicule client *</label>
            <select name="clientId" class="w-full px-3 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 text-xs font-bold">
              ${db.clients.map(c => `<option value="${c.id}">${c.plate} — ${c.vehicle} (${c.name})</option>`).join('')}
            </select>
          </div>
          <div class="grid grid-cols-2 gap-2.5">
            <div>
              <label class="block text-xs font-semibold mb-1">Poste / Piste *</label>
              <select name="bay" class="w-full px-3 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 text-xs font-bold">
                <option value="Piste Lavage 1">🚿 Piste Lavage 1</option>
                <option value="Piste Lavage 2">🚿 Piste Lavage 2</option>
                <option value="Zone Intérieur">🧽 Zone Intérieur</option>
                <option value="Pont Vidange">🛢️ Pont Vidange</option>
              </select>
            </div>
            <div>
              <label class="block text-xs font-semibold mb-1">Prestation prévue *</label>
              <select name="service" class="w-full px-3 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 text-xs font-bold">
                ${db.catalog.filter(i => i.category === 'service').map(s => `<option value="${s.name}">${s.name}</option>`).join('')}
              </select>
            </div>
          </div>
          <button type="submit" class="w-full py-3 rounded-xl bg-cyan-600 text-white font-bold text-xs shadow-lg">
            Démarrer la prise en charge
          </button>
        </form>
      `);
    }

    function submitAddToQueue(e) {
      e.preventDefault();
      const f = e.target;
      const client = db.clients.find(c => c.id === f.clientId.value);
      if (!client) return;
      const timeStr = new Date().toTimeString().slice(0, 5);
      db.activeQueue.unshift({
        id: 'q_' + Date.now(),
        clientId: client.id,
        plate: client.plate,
        plateType: client.plateType,
        clientName: client.name,
        vehicle: client.vehicle,
        bay: f.bay.value,
        service: f.service.value,
        status: 'washing',
        startTime: timeStr
      });
      saveDB();
      closeModal();
      showToast(`${client.plate} placé sur ${f.bay.value}`, 'success');
      renderCurrentRoute();
    }

    function markQueueReady(queueId) {
      const q = db.activeQueue.find(item => item.id === queueId);
      if (!q) return;
      q.status = 'ready';
      saveDB();
      showToast(`Véhicule ${q.plate} prêt pour remise des clés !`, 'success');
      renderCurrentRoute();
    }

    function checkoutQueueItem(queueId) {
      const q = db.activeQueue.find(item => item.id === queueId);
      if (!q) return;
      db.activeQueue = db.activeQueue.filter(item => item.id !== queueId);
      saveDB();
      openNewTicketModal(q.clientId);
      renderCurrentRoute();
    }

    function removeQueueItem(queueId) {
      db.activeQueue = db.activeQueue.filter(item => item.id !== queueId);
      saveDB();
      renderCurrentRoute();
    }

    function handleManualPlateSubmit(e) {
      e.preventDefault();
      const val = document.getElementById('manual-plate-input').value;
      if (!val.trim()) return;
      processScannedPlate(val);
    }

    function processScannedPlate(rawPlate) {
      const detected = detectPlateFormat(rawPlate);
      const existing = db.clients.find(c => c.plate.toUpperCase() === detected.formatted);

      if (existing) {
        openClientDetailModal(existing.id);
      } else {
        openNewClientModal(detected.formatted, detected.type);
      }
    }

    // ============================================================================
    // FICHE CLIENT, HISTORIQUE, PARAMÈTRES VIDANGE & NOUVEAU TICKET
    // ============================================================================
    function renderClientSummaryCard(client) {
      const kmRemaining = client.nextOilKm - client.currentKm;
      let statusBadge = `<span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-emerald-500/15 text-emerald-500">OK (${kmRemaining.toLocaleString()} km)</span>`;
      if (kmRemaining <= 0) {
        statusBadge = `<span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-rose-500/15 text-rose-500 animate-pulse"><i class="fa-solid fa-triangle-exclamation mr-1"></i>Vidange dépassée !</span>`;
      } else if (kmRemaining <= 1000) {
        statusBadge = `<span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-amber-500/15 text-amber-500">Vidange dans ${kmRemaining} km</span>`;
      }

      return `
        <div onclick="openClientDetailModal('${client.id}')" class="cursor-pointer bg-white dark:bg-slateDark-900 p-3.5 rounded-2xl border border-slate-200 dark:border-slate-800 hover:border-cyan-500/50 transition flex items-center justify-between gap-3">
          <div class="space-y-1.5 min-w-0">
            <div class="flex items-center gap-2 flex-wrap">
              ${renderPlateBadge(client.plate, client.plateType)}
              ${statusBadge}
            </div>
            <p class="font-bold text-sm truncate">${client.name} <span class="font-normal text-slate-400">• ${client.vehicle}</span></p>
            <p class="text-[11px] text-slate-500 dark:text-slate-400">
              Compteur : <strong class="text-slate-700 dark:text-slate-200">${client.currentKm.toLocaleString()} km</strong> • Proch. vidange : <strong>${client.nextOilKm.toLocaleString()} km</strong>
            </p>
          </div>
          <i class="fa-solid fa-chevron-right text-slate-400 text-xs"></i>
        </div>
      `;
    }

    function openClientDetailModal(clientId) {
      const c = db.clients.find(item => item.id === clientId);
      if (!c) return;

      const kmDiff = c.nextOilKm - c.currentKm;
      const alertBox = kmDiff <= 1000
        ? `<div class="p-3 rounded-2xl ${kmDiff <= 0 ? 'bg-rose-500/15 border-rose-500/40 text-rose-400' : 'bg-amber-500/15 border-amber-500/40 text-amber-400'} border text-xs font-semibold flex items-center gap-2">
            <i class="fa-solid fa-oil-can text-base"></i>
            <span>${kmDiff <= 0 ? `Attention : Vidange dépassée de ${Math.abs(kmDiff).toLocaleString()} km !` : `Vidange recommandée très bientôt (reste ${kmDiff.toLocaleString()} km).`}</span>
          </div>`
        : '';

      const oils = db.catalog.filter(i => i.category === 'oil');

      openModal(`Fiche Véhicule • ${c.plate}`, `
        <div class="space-y-4">
          <!-- En-tête Plaque & Client -->
          <div class="flex items-center justify-between bg-slate-100 dark:bg-slate-800/70 p-3.5 rounded-2xl">
            <div>
              ${renderPlateBadge(c.plate, c.plateType)}
              <h4 class="font-extrabold text-base mt-2">${c.name}</h4>
              <p class="text-xs text-slate-500 dark:text-slate-400">${c.vehicle} • <i class="fa-solid fa-phone text-[10px]"></i> ${c.phone}</p>
            </div>
            <button onclick="openNewTicketModal('${c.id}')" class="px-3.5 py-2.5 rounded-xl bg-gradient-to-r from-cyan-500 to-blue-600 text-white font-bold text-xs shadow-lg shadow-cyan-500/25 flex flex-col items-center gap-1">
              <i class="fa-solid fa-plus-circle text-base"></i>
              <span>Nouveau Lavage / Vidange</span>
            </button>
          </div>

          ${alertBox}

          <!-- Paramètres d'entretien & Modification Kilométrage Vidange -->
          <form onsubmit="updateClientMaintenance(event, '${c.id}')" class="bg-slate-50 dark:bg-slate-800/40 p-3.5 rounded-2xl border border-slate-200 dark:border-slate-800 space-y-3">
            <div class="flex items-center justify-between">
              <h5 class="text-xs font-extrabold uppercase tracking-wider text-cyan-500">
                <i class="fa-solid fa-sliders mr-1"></i> Paramètres Entretien & Vidange
              </h5>
            </div>

            <div class="grid grid-cols-2 gap-2.5">
              <div>
                <label class="block text-[11px] font-semibold text-slate-400 mb-1">Kilométrage Actuel</label>
                <input type="number" name="currentKm" value="${c.currentKm}" required
                  class="w-full px-3 py-2 rounded-xl bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 text-xs font-bold" />
              </div>
              <div>
                <label class="block text-[11px] font-semibold text-amber-500 mb-1">Prochaine Vidange (km)</label>
                <input type="number" name="nextOilKm" value="${c.nextOilKm}" required
                  class="w-full px-3 py-2 rounded-xl bg-white dark:bg-slate-900 border border-amber-500/50 text-xs font-bold text-amber-500" />
              </div>
            </div>

            <div>
              <label class="block text-[11px] font-semibold text-slate-400 mb-1">Huile Moteur Recommandée</label>
              <select name="preferredOil" class="w-full px-3 py-2 rounded-xl bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 text-xs">
                <option value="${c.preferredOil}">${c.preferredOil}</option>
                ${oils.map(o => `<option value="${o.name}">${o.name} (${o.viscosity})</option>`).join('')}
              </select>
            </div>

            <div class="grid grid-cols-2 gap-2.5">
              <div>
                <label class="block text-[11px] font-semibold text-slate-400 mb-1">Téléphone</label>
                <input type="text" name="phone" value="${c.phone}"
                  class="w-full px-3 py-2 rounded-xl bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 text-xs" />
              </div>
              <div>
                <label class="block text-[11px] font-semibold text-slate-400 mb-1">Modèle Véhicule</label>
                <input type="text" name="vehicle" value="${c.vehicle}"
                  class="w-full px-3 py-2 rounded-xl bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 text-xs" />
              </div>
            </div>

            <button type="submit" class="w-full py-2.5 rounded-xl bg-slate-900 dark:bg-cyan-600 text-white font-bold text-xs hover:opacity-95 transition">
              <i class="fa-solid fa-floppy-disk mr-1"></i> Enregistrer les paramètres
            </button>
          </form>

          <!-- Historique des passages du client -->
          <div class="space-y-2">
            <h5 class="text-xs font-extrabold uppercase tracking-wider text-slate-400">
              Historique des interventions (${c.history.length})
            </h5>
            ${c.history.length === 0 ? `<p class="text-xs text-slate-500 italic">Aucune intervention enregistrée.</p>` : ''}
            <div class="space-y-2 max-h-52 overflow-y-auto pr-1">
              ${c.history.map(h => `
                <div class="p-3 rounded-xl bg-slate-100/80 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700/70 text-xs space-y-1">
                  <div class="flex items-center justify-between font-bold">
                    <span class="text-cyan-500">${h.date} • ${Number(h.km).toLocaleString()} km</span>
                    <span class="text-emerald-500">${formatPrice(h.total)}</span>
                  </div>
                  <p class="text-slate-700 dark:text-slate-200 font-medium">${h.items.join(' + ')}</p>
                  <p class="text-[10px] text-slate-400">Opérateur : ${h.tech || 'Station'}</p>
                </div>
              `).join('')}

          </div>

          ${isAdmin() ? `
            <div class="pt-2 border-t border-slate-200 dark:border-slate-800 flex justify-end">
              <button onclick="deleteClient('${c.id}')" class="text-xs text-rose-500 font-semibold hover:underline">
                <i class="fa-solid fa-trash mr-1"></i> Supprimer ce client
              </button>
            </div>
          ` : ''}
        </div>
      `);
    }

    function updateClientMaintenance(e, clientId) {
      e.preventDefault();
      const form = e.target;
      const c = db.clients.find(item => item.id === clientId);

    function recalcTicketTotal() {
      const checked = document.querySelectorAll('input[name="ticketItems"]:checked');
      let sum = 0;
      checked.forEach(cb => sum += parseFloat(cb.dataset.price || 0));
      const el = document.getElementById('ticket-live-total');
      if (el) el.textContent = formatPrice(sum);
    }

    function submitClientTicket(e, clientId) {
      e.preventDefault();
      const form = e.target;
      const c = db.clients.find(item => item.id === clientId);
      if (!c) return;

      const checked = Array.from(form.querySelectorAll('input[name="ticketItems"]:checked'));
      if (checked.length === 0) {
        showToast('Veuillez sélectionner au moins un service ou produit', 'warning');
        return;
      }

      const selectedNames = [];
      let total = 0;

      checked.forEach(cb => {
        const prod = db.catalog.find(item => item.id === cb.value);
        if (prod) {
          selectedNames.push(prod.name);
          total += prod.price;
          if (prod.category !== 'service' && prod.stock > 0) {
            prod.stock -= 1;
          }
        }
      });

      const visitKm = parseInt(form.visitKm.value, 10) || c.currentKm;
      const nextKm = parseInt(form.updatedNextOilKm.value, 10) || c.nextOilKm;

      c.currentKm = visitKm;
      c.nextOilKm = nextKm;

      // Ajout à l'historique client
      c.history.unshift({
        id: 'h_' + Date.now(),
        date: todayISO,
        km: visitKm,
        items: selectedNames,
        total,
        tech: getActiveUser().name
      });

      // Ajout dans la comptabilité (Recettes)
      db.transactions.unshift({
        id: 'tr_' + Date.now(),
        type: 'income',
        date: todayISO,
        label: `${selectedNames[0]}${selectedNames.length > 1 ? ` +${selectedNames.length - 1}` : ''} (${c.plate})`,
        amount: total,
        category: selectedNames.some(n => n.toLowerCase().includes('vidange')) ? 'Vidange' : 'Lavage'
      });

      // Retirer de la file d'attente si présent
      db.activeQueue = db.activeQueue.filter(q => q.clientId !== c.id);

      saveDB();
      showToast(`Ticket validé : +${formatPrice(total)} encaissés !`, 'success');
      renderCurrentRoute();
      openReceiptModal(c, selectedNames, total, visitKm, nextKm);
    }

                <button onclick="processScannedBarcode('6130001122334')" class="text-[10px] px-2.5 py-1 rounded-lg bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 font-medium">Filtre à Huile</button>

    }

    function normalizeProductBarcode(value) {
      return String(value ?? '').trim().replace(/\\s+/g, '').toUpperCase();
    }

    function handleManualBarcodeSubmit(e) {
      e.preventDefault();
      const input = document.getElementById('manual-barcode-input');
      const val = normalizeProductBarcode(input?.value);
      if (!val) {
        showToast('Saisissez un code produit valide.', 'warning');
        input?.focus();
        return;
      }
      processScannedBarcode(val);
      if (input) {
        input.value = '';
        input.focus();
      }
    }

    function processScannedBarcode(rawCode) {
      const code = normalizeProductBarcode(rawCode);
      if (!code) {
        showToast('Aucun code produit détecté.', 'warning');
        return;
      }

      const catalog = Array.isArray(db.catalog) ? db.catalog : [];
      const item = catalog.find(product =>
        normalizeProductBarcode(product?.barcode) === code
      );

      if (isAdmin()) {
        // MODE ADMIN : Formulaire d'ajout ou d'édition pré-rempli avec le code scanné
        openProductFormModal(item || { barcode: code, category: 'product' });
      } else {
        // MODE EMPLOYÉ : Consultation rapide du prix uniquement (lecture seule)
        if (!item) {
          openModal('Produit Non Référencé', `
            <div class="text-center py-6 space-y-3">
              <div class="w-14 h-14 rounded-2xl bg-rose-500/15 text-rose-500 flex items-center justify-center text-2xl mx-auto">
                <i class="fa-solid fa-box-open"></i>
              </div>
              <p class="font-bold text-sm">Code : <span class="font-mono text-cyan-500">${code}</span></p>
              <p class="text-xs text-slate-400">Ce produit n'est pas encore enregistré dans le catalogue. Demandez à l'administrateur de l'ajouter.</p>
            </div>
          `);
          return;
        }

        openModal('Tarif Produit (Lecture Seule)', `
          <div class="space-y-4">
            <div class="p-4 rounded-2xl bg-gradient-to-br from-slate-900 to-slate-800 text-white border border-slate-700 space-y-2">
              <div class="flex items-center justify-between">
                <span class="text-[10px] font-mono px-2 py-0.5 rounded bg-white/10 text-cyan-300">${item.barcode}</span>
                <span class="text-[10px] font-bold uppercase px-2 py-0.5 rounded bg-cyan-500/20 text-cyan-300">
                  ${item.category === 'oil' ? 'Huile Moteur' : item.category === 'service' ? 'Service' : 'Produit'}
                </span>
              </div>
              <h4 class="text-lg font-extrabold pt-1">${item.name}</h4>
              ${item.category === 'oil' ? `<p class="text-xs text-amber-400 font-semibold">${item.brand} • Viscosité ${item.viscosity} • ${item.capacity}</p>` : ''}
              <div class="pt-3 border-t border-white/10 flex items-end justify-between">
                <div>
                  <p class="text-[10px] uppercase text-slate-400">Prix Client</p>
                  <p class="text-2xl font-extrabold text-emerald-400">${formatPrice(item.price)}</p>
                </div>
                <div class="text-right">
                  <p class="text-[10px] uppercase text-slate-400">Disponibilité</p>
                  <p class="text-xs font-bold ${item.stock > 5 ? 'text-emerald-400' : 'text-amber-400'}">
                    ${item.category === 'service' ? 'Disponible' : `${item.stock} en stock`}

            <button onclick="closeModal()" class="w-full py-2.5 rounded-xl bg-slate-200 dark:bg-slate-800 font-bold text-xs">Fermer</button>

      const item = db.catalog.find(i => i.id === id);

      item.stock += 5;
      saveDB();
      showToast(`+5 ajoutés au stock de "${item.name}" (Total : ${item.stock})`, 'success');
      renderCurrentRoute();
    }

    function editCatalogItem(id) {
      const item = db.catalog.find(i => i.id === id);
      if (item) openProductFormModal(item);
    }

      db.catalog = db.catalog.filter(i => i.id !== id);
      saveDB();
      showToast('Élément supprimé du catalogue', 'warning');
      renderCurrentRoute();
    }

    function toggleOilFields(val) {
      const box = document.getElementById('oil-specific-fields');
      if (!box) return;
      if (val === 'oil') {
        box.classList.remove('hidden');
        box.classList.add('grid');
      } else {
        box.classList.add('hidden');
        box.classList.remove('grid');
      }
    }

    function saveCatalogItem(e, existingId) {
      e.preventDefault();
      const f = e.target;
      const category = f.category.value;
      const payload = {
        id: existingId || 'cat_' + Date.now(),
        category,
        name: f.name.value.trim(),
        price: parseFloat(f.price.value) || 0,
        stock: category === 'service' ? 999 : (parseInt(f.stock.value, 10) || 0),
        barcode: f.barcode.value.trim(),
        unit: category === 'service' ? 'Prestation' : 'Unité',
        brand: f.brand ? f.brand.value.trim() : '',
        viscosity: f.viscosity ? f.viscosity.value.trim() : '',
        capacity: f.capacity ? f.capacity.value.trim() : '',
        oilType: 'Synthétique'
      };

      if (existingId) {
        const idx = db.catalog.findIndex(i => i.id === existingId);
        if (idx !== -1) db.catalog[idx] = { ...db.catalog[idx], ...payload };
        showToast('Article mis à jour avec succès', 'success');
      } else {
        db.catalog.unshift(payload);
        showToast('Nouvel article ajouté au catalogue', 'success');
      }

      saveDB();
      closeModal();
      renderCurrentRoute();
    }

        <!-- Journal des Opérations de la Période -->
        <div class="bg-white dark:bg-slateDark-900 p-4 rounded-3xl border border-slate-200 dark:border-slate-800 space-y-2.5">
          <h3 class="text-xs font-extrabold uppercase tracking-wider text-slate-400">Opérations (${filteredTx.length})</h3>
          <div class="space-y-2 max-h-52 overflow-y-auto pr-1">
            ${filteredTx.length === 0 ? `<p class="text-xs text-slate-500 italic">Aucune opération sur cette période.</p>` : ''}
            ${filteredTx.map(t => `
              <div class="flex items-center justify-between p-2.5 rounded-xl bg-slate-50 dark:bg-slate-800/50 text-xs">
                <div class="min-w-0 pr-2">
                  <p class="font-bold truncate">${t.label}</p>
                  <p class="text-[10px] text-slate-400">${t.date} • ${t.category}</p>
                </div>
                <span class="font-extrabold whitespace-nowrap ${t.type === 'income' ? 'text-emerald-500' : 'text-rose-500'}">
                  ${t.type === 'income' ? '+' : '-'}${formatPrice(t.amount)}
                </span>
              </div>
            `).join('')}
          </div>
        </div>

        <!-- Gestion des Utilisateurs (Admin & Employés) -->
        <div class="bg-white dark:bg-slateDark-900 p-4 rounded-3xl border border-slate-200 dark:border-slate-800 space-y-3">
          <div class="flex items-center justify-between">
            <h3 class="text-xs font-extrabold uppercase tracking-wider text-amber-500">
              <i class="fa-solid fa-users-gear mr-1"></i> Gestion des Utilisateurs
            </h3>
            <button onclick="openUserFormModal()" class="text-xs font-bold text-cyan-500 hover:underline">
              + Ajouter Utilisateur
            </button>
          </div>

          <div class="space-y-2">
            ${db.users.map(u => `
              <div class="flex items-center justify-between p-3 rounded-xl bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700/60">
                <div class="min-w-0 pr-2">
                  <p class="text-xs font-bold flex items-center gap-1.5 flex-wrap">
                    <span class="truncate">${u.name}</span>
                    <span class="text-[9px] px-1.5 py-0.5 rounded uppercase font-extrabold ${u.role === 'admin' ? 'bg-amber-500/20 text-amber-500' : 'bg-cyan-500/20 text-cyan-500'}">
                      ${u.role === 'admin' ? 'Admin' : 'Employé'}
                    </span>
                    <span class="text-[9px] px-1.5 py-0.5 rounded uppercase font-extrabold ${u.active !== false ? 'bg-emerald-500/15 text-emerald-500' : 'bg-rose-500/15 text-rose-500'}">
                      ${u.active !== false ? 'Actif' : 'Inactif'}
                    </span>
                  </p>
                  <p class="text-[10px] text-cyan-500 font-mono mt-0.5 truncate"><i class="fa-solid fa-envelope mr-1"></i>${u.login}</p>
                  <p class="text-[10px] text-slate-400">${u.phone || 'Tél non renseigné'}</p>
                </div>
                <div class="flex items-center gap-1.5 shrink-0">
                  <button onclick="openUserFormModal('${u.id}')" class="w-7 h-7 rounded-lg bg-white dark:bg-slate-900 text-cyan-500 text-xs flex items-center justify-center border border-slate-200 dark:border-slate-700">
                    <i class="fa-solid fa-pen"></i>
                  </button>
                  ${db.users.length > 1 ? `
                    <button onclick="deleteUser('${u.id}')" class="w-7 h-7 rounded-lg bg-white dark:bg-slate-900 text-rose-500 text-xs flex items-center justify-center border border-slate-200 dark:border-slate-700">
                      <i class="fa-solid fa-trash"></i>
                    </button>
                  ` : ''}
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    function openAddExpenseModal() {
      openModal('Enregistrer une Dépense', `
        <form onsubmit="submitNewExpense(event)" class="space-y-3.5">
          <div>
            <label class="block text-xs font-semibold mb-1">Libellé de la dépense *</label>
            <input type="text" name="label" required placeholder="Ex: Achat bidons shampooing, Facture eau..."
              class="w-full px-3 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 text-sm" />
          </div>
          <div class="grid grid-cols-2 gap-2.5">
            <div>
              <label class="block text-xs font-semibold mb-1">Montant (${db.currency}) *</label>
              <input type="number" name="amount" required min="1" placeholder="2500"
                class="w-full px-3 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 text-sm font-bold text-rose-500" />
            </div>
            <div>
              <label class="block text-xs font-semibold mb-1">Catégorie</label>
              <select name="category" class="w-full px-3 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 text-xs font-bold">
                <option value="Produits Lavage">Produits Lavage</option>
                <option value="Stock Huiles/Filtres">Stock Huiles/Filtres</option>
                <option value="Eau & Électricité">Eau & Électricité</option>
                <option value="Salaires">Salaires</option>
                <option value="Maintenance">Maintenance</option>
              </select>
            </div>
          </div>
          <div>
            <label class="block text-xs font-semibold mb-1">Date</label>
            <input type="date" name="date" value="${todayISO}" required
              class="w-full px-3 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 text-xs" />
          </div>
          <button type="submit" class="w-full py-3 rounded-xl bg-rose-600 hover:bg-rose-500 text-white font-bold text-xs shadow-lg">
            Enregistrer la dépense
          </button>
        </form>
      `);
    }

    function submitNewExpense(e) {
      e.preventDefault();
      const f = e.target;
      db.transactions.unshift({
        id: 'exp_' + Date.now(),
        type: 'expense',
        date: f.date.value,
        label: f.label.value.trim(),
        amount: parseFloat(f.amount.value) || 0,
        category: f.category.value
      });
      saveDB();
      closeModal();
      showToast('Dépense enregistrée dans la comptabilité', 'info');
      renderCurrentRoute();
    }

    function openUserFormModal(userId = '') {
      const user = db.users.find(u => u.id === userId) || {};
      const isEdit = Boolean(user.id);

      openModal(isEdit ? 'Modifier Utilisateur' : 'Nouvel Utilisateur', `
        <form onsubmit="saveUser(event, '${user.id || ''}')" class="space-y-3">
          <div>
            <label class="block text-xs font-semibold mb-1">Nom & Prénom *</label>
            <input type="text" name="name" value="${user.name || ''}" required placeholder="Ex: Samir (Lavagiste)"
              class="w-full px-3 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 text-sm" />
          </div>
          <div class="grid grid-cols-2 gap-2.5">
            <div>
              <label class="block text-xs font-semibold mb-1">Rôle & Permissions *</label>
              <select name="role" class="w-full px-2.5 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 text-xs font-bold">
                <option value="employee" ${user.role === 'employee' ? 'selected' : ''}>🧼 Employé / Lavagiste</option>
                <option value="admin" ${user.role === 'admin' ? 'selected' : ''}>👑 Administrateur</option>
              </select>
            </div>
            <div>
              <label class="block text-xs font-semibold mb-1">Statut du compte</label>
              <select name="active" class="w-full px-2.5 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 text-xs font-bold">
                <option value="true" ${user.active !== false ? 'selected' : ''}>✅ Actif</option>
                <option value="false" ${user.active === false ? 'selected' : ''}>⛔ Inactif</option>
              </select>
            </div>
          </div>
          <div>
            <label class="block text-xs font-semibold mb-1">Identifiant de connexion (Email ou Pseudo) *</label>
            <input type="text" name="login" value="${user.login || ''}" required placeholder="Ex: samir@az-lavage.dz"
              class="w-full px-3 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 font-mono text-xs" />
          </div>
          <div>
            <label class="block text-xs font-semibold mb-1">Mot de passe *</label>
            <input type="text" name="password" value="${user.password || ''}" required placeholder="Ex: lavage123"
              class="w-full px-3 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 font-mono text-xs" />
          </div>
          <div>
            <label class="block text-xs font-semibold mb-1">Téléphone</label>
            <input type="tel" name="phone" value="${user.phone || ''}" placeholder="0550 00 00 00"
              class="w-full px-3 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 text-sm" />
          </div>
          <button type="submit" class="w-full py-3 rounded-xl bg-cyan-600 text-white font-bold text-xs shadow-lg">
            ${isEdit ? 'Enregistrer modifications' : 'Créer l\'utilisateur'}
          </button>
        </form>
      `);
    }

    function saveUser(e, userId) {
      e.preventDefault();
      const f = e.target;
      const loginVal = f.login.value.trim().toLowerCase();
      const duplicate = db.users.find(u => u.login.toLowerCase() === loginVal && u.id !== userId);
      if (duplicate) {
        showToast('Cet identifiant de connexion est déjà utilisé', 'error');
        return;
      }

      const isActive = f.active.value === 'true';

      if (userId) {
        const u = db.users.find(item => item.id === userId);
        if (u) {
          u.name = f.name.value.trim();
          u.role = f.role.value;
          u.login = loginVal;
          u.password = f.password.value;
          u.phone = f.phone.value.trim();
          u.active = isActive;
        }
        showToast('Utilisateur mis à jour', 'success');
      } else {
        db.users.push({
          id: 'u_' + Date.now(),
          name: f.name.value.trim(),
          role: f.role.value,
          login: loginVal,
          password: f.password.value,
          phone: f.phone.value.trim(),
          active: isActive
        });
        showToast('Nouvel utilisateur créé (connexion immédiate possible)', 'success');
      }
      saveDB();
      renderHeaderUserInfo();
      closeModal();
      renderCurrentRoute();
    }

    function deleteUser(userId) {
      if (db.activeUserId === userId) {
        showToast('Impossible de supprimer l\'utilisateur actif', 'error');
        return;
      }
      db.users = db.users.filter(u => u.id !== userId);
      saveDB();
      closeModal();
      showToast('Utilisateur supprimé', 'warning');
      renderCurrentRoute();
    }

    // ============================================================================
    // INITIALISATION AU CHARGEMENT (VÉRIFICATION SESSION OU AFFICHAGE LOGIN)
    // ============================================================================
    window.addEventListener('DOMContentLoaded', () => {
      const rememberedUserId = localStorage.getItem(SESSION_KEY) || db.activeUserId;
      const validUser = rememberedUserId ? db.users.find(u => u.id === rememberedUserId && u.active !== false) : null;

      if (validUser) {
        db.activeUserId = validUser.id;
        saveDB();
        enterAuthenticatedApp(validUser);
      } else {
        db.activeUserId = null;
        saveDB();
        document.getElementById('login-screen').classList.remove('hidden');
        document.getElementById('authenticated-shell').classList.add('hidden');
      }
    });
  </script>
</body>
</html>
