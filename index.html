<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AZ-AutoClean - Gestion Station Lavage & Vidange</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #020617;
            color: #f8fafc;
            -webkit-tap-highlight-color: transparent;
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        @keyframes scanline {
            0% { top: 10%; }
            50% { top: 85%; }
            100% { top: 10%; }
        }
        .animate-scanline {
            animation: scanline 2.2s ease-in-out infinite;
        }
    </style>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 flex justify-center selection:bg-blue-500 selection:text-white">

    <!-- Conteneur Mobile Centré -->
    <div id="app" class="w-full max-w-md min-h-screen bg-slate-950 border-x border-slate-900 flex flex-col relative shadow-2xl overflow-x-hidden">
        <!-- Le contenu dynamique est injecté ici -->
    </div>

    <!-- Modale Générique -->
    <div id="modal-backdrop" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm hidden items-center justify-center p-4">
        <div id="modal-container" class="bg-slate-900 border border-slate-800 rounded-3xl w-full max-w-sm p-5 shadow-2xl transform transition-all max-h-[90vh] overflow-y-auto no-scrollbar">
            <!-- Contenu modale -->
        </div>
    </div>

    <script>
        // ==========================================
        // 1. ÉTAT GLOBAL & PERSISTANCE LOCALSTORAGE
        // ==========================================
        const DEFAULT_STATE = {
            currentUser: null, // { id, name, role: 'admin'|'cashier'|'washer', pin }
            currentView: 'home', // 'home', 'pos', 'journal', 'clients', 'admin'
            selectedVehicleId: null,
            users: [
                { id: 1, name: 'Karim Benali', role: 'admin', pin: '1234', active: true },
                { id: 2, name: 'Sofiane Hadj', role: 'cashier', pin: '5678', active: true },
                { id: 3, name: 'Mourad Ziani', role: 'washer', pin: '0000', active: true }
            ],
            vehicles: [
                { id: 101, plate: '01234-116-16', brandModel: 'Renault Symbol', owner: 'Amine Larbi', phone: '0555123456', mileage: 44500, nextOilMileage: 50000, lastService: '10/01/2026' },
                { id: 102, plate: '09876-119-31', brandModel: 'Volkswagen Golf 7', owner: 'Rachid Kaci', phone: '0661987654', mileage: 88200, nextOilMileage: 90000, lastService: '02/02/2026' },
                { id: 103, plate: '04512-108-16', brandModel: 'Hyundai Accent', owner: 'Samir Boudiaf', phone: '0770451278', mileage: 112000, nextOilMileage: 115000, lastService: '15/12/2025' }
            ],
            catalog: [
                { id: 1, name: 'Lavage Complet (Intérieur + Extérieur)', type: 'service', price: 1500 },
                { id: 2, name: 'Lavage Simple Extérieur', type: 'service', price: 800 },
                { id: 3, name: 'Vidange Huile 5W40 (5L)', type: 'service', price: 6500 },
                { id: 4, name: 'Huile Moteur Total 10W40 (5L)', type: 'product', price: 4200, stock: 18, barcode: '34259010' },
                { id: 5, name: 'Filtre à Huile Purflux', type: 'product', price: 1200, stock: 24, barcode: '32859301' },
                { id: 6, name: 'Liquide de Refroidissement 5L', type: 'product', price: 1800, stock: 10, barcode: '54100592' },
                { id: 7, name: 'Lave-Glace Parfumé', type: 'product', price: 500, stock: 35, barcode: '76123489' }
            ],
            passages: [
                { id: 1, clientName: 'Amine Larbi', plate: '01234-116-16', employeeName: 'Mourad Ziani', items: ['Lavage Complet (Intérieur + Extérieur)'], totalAmount: 1500, date: '15/02/2026 10:30' },
                { id: 2, clientName: 'Rachid Kaci', plate: '09876-119-31', employeeName: 'Sofiane Hadj', items: ['Vidange Huile 5W40 (5L)', 'Filtre à Huile Purflux'], totalAmount: 7700, date: '15/02/2026 12:15' }
            ],
            posCart: []
        };

        let appState = loadState();

        function loadState() {
            const saved = localStorage.getItem('az_autoclean_state_v3');
            if (saved) {
                try { return JSON.parse(saved); } catch (e) { console.error(e); }
            }
            return JSON.parse(JSON.stringify(DEFAULT_STATE));
        }

        function saveState() {
            localStorage.setItem('az_autoclean_state_v3', JSON.stringify(appState));
        }

        function resetState() {
            if (confirm("Réinitialiser toutes les données de l'application ?")) {
                localStorage.removeItem('az_autoclean_state_v3');
                appState = JSON.parse(JSON.stringify(DEFAULT_STATE));
                renderApp();
            }
        }

        // ==========================================
        // 2. LOGO VECTORIEL "AZ" MINIMALISTE LUXE
        // ==========================================
        function getBrandLogoSVG(size = 40) {
            return `
                <svg width="${size}" height="${size}" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="azGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#38bdf8"/>
                            <stop offset="50%" stop-color="#2563eb"/>
                            <stop offset="100%" stop-color="#1e1b4b"/>
                        </linearGradient>
                        <linearGradient id="waveGrad" x1="0%" y1="50%" x2="100%" y2="50%">
                            <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
                            <stop offset="100%" stop-color="#60a5fa" stop-opacity="0.2"/>
                        </linearGradient>
                    </defs>
                    <rect width="100" height="100" rx="28" fill="url(#azGrad)"/>
                    <path d="M15 70C35 85 65 85 85 70" stroke="url(#waveGrad)" stroke-width="6" stroke-linecap="round"/>
                    <path d="M25 65L42 32H58L75 65" stroke="white" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M33 53H67" stroke="white" stroke-width="6" stroke-linecap="round"/>
                    <path d="M57 32L35 68H65" stroke="white" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
                    <circle cx="74" cy="30" r="5" fill="#38bdf8"/>
                </svg>
            `;
        }

        // ==========================================
        // 3. UTILITAIRES MODALE & NOTIFICATION
        // ==========================================
        function openCustomModal(htmlContent) {
            const backdrop = document.getElementById('modal-backdrop');
            const container = document.getElementById('modal-container');
            container.innerHTML = htmlContent;
            backdrop.classList.remove('hidden');
            backdrop.classList.add('flex');
        }

        function closeModal() {
            const backdrop = document.getElementById('modal-backdrop');
            backdrop.classList.remove('flex');
            backdrop.classList.add('hidden');
        }

        function showMessage(msg, title = "Information") {
            openCustomModal(`
                <div class="text-center space-y-4">
                    <div class="w-12 h-12 bg-blue-500/10 text-blue-400 rounded-2xl mx-auto flex items-center justify-center text-xl">
                        <i class="fa-solid fa-circle-info"></i>
                    </div>
                    <div>
                        <h3 class="font-bold text-white text-base">${title}</h3>
                        <p class="text-xs text-slate-300 mt-1">${msg}</p>
                    </div>
                    <button onclick="closeModal()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-2.5 rounded-xl text-xs">
                        Compris
                    </button>
                </div>
            `);
        }

        // ==========================================
        // 4. ÉCRAN DE CONNEXION (SANS SIMULATION)
        // ==========================================
        function renderLoginView() {
            const activeUsers = appState.users.filter(u => u.active);
            const userOptions = activeUsers.map(u => {
                const roleLabel = u.role === 'admin' ? 'Admin' : (u.role === 'cashier' ? 'Caissier' : 'Lavagiste');
                return `<option value="${u.id}">${u.name} (${roleLabel})</option>`;
            }).join('');

            return `
                <div class="flex-1 flex flex-col justify-center px-6 py-8">
                    <div class="text-center mb-7">
                        <div class="inline-flex items-center justify-center mb-3">
                            ${getBrandLogoSVG(78)}
                        </div>
                        <h1 class="text-2xl font-extrabold tracking-tight text-white">
                            AZ-<span class="text-transparent bg-clip-text bg-gradient-to-r from-sky-400 to-blue-500">AutoClean</span>
                        </h1>
                        <p class="text-xs text-slate-400 mt-1">Station Lavage, Vidange & Entretien Pro</p>
                    </div>

                    <form onsubmit="handleLogin(event)" class="bg-slate-900/80 border border-slate-800 rounded-3xl p-5 space-y-4 shadow-xl">
                        <div>
                            <label class="block text-xs font-medium text-slate-400 mb-1.5">Sélectionner un employé</label>
                            <select id="login-user-id" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-3 text-sm text-white focus:outline-none focus:border-blue-500">
                                ${userOptions}
                            </select>
                        </div>

                        <div>
                            <label class="block text-xs font-medium text-slate-400 mb-1.5">Code PIN d'accès</label>
                            <input type="password" id="login-pin" maxlength="6" inputmode="numeric" placeholder="••••" required
                                class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-3 text-center text-lg tracking-[0.5em] text-white focus:outline-none focus:border-blue-500">
                        </div>

                        <button type="submit" class="w-full bg-gradient-to-r from-blue-600 to-sky-500 hover:from-blue-500 hover:to-sky-400 text-white font-semibold py-3.5 rounded-xl transition-all shadow-lg shadow-blue-600/30 text-sm">
                            Se connecter
                        </button>
                    </form>
                </div>
            `;
        }

        function handleLogin(event) {
            event.preventDefault();
            const userId = parseInt(document.getElementById('login-user-id').value);
            const pin = document.getElementById('login-pin').value.trim();
            const found = appState.users.find(u => u.id === userId && u.pin === pin && u.active);
            if (!found) {
                showMessage("Code PIN incorrect ou compte désactivé.", "Échec de connexion");
                return;
            }
            appState.currentUser = found;
            appState.currentView = 'home';
            renderApp();
        }

        function logoutUser() {
            appState.currentUser = null;
            appState.posCart = [];
            appState.selectedVehicleId = null;
            renderApp();
        }

        // ==========================================
        // 5. EN-TÊTE & NAVIGATION BASSE
        // ==========================================
        function renderHeader() {
            if (!appState.currentUser) return '';
            const roleBadge = appState.currentUser.role === 'admin' ? 'Admin' : (appState.currentUser.role === 'cashier' ? 'Caissier' : 'Lavagiste');
            
            return `
                <header class="bg-slate-900/90 backdrop-blur border-b border-slate-800 sticky top-0 z-40 px-4 py-3 flex items-center justify-between">
                    <div class="flex items-center space-x-2.5 cursor-pointer" onclick="appState.currentView='home'; renderApp();">
                        ${getBrandLogoSVG(36)}
                        <div>
                            <h1 class="text-sm font-bold text-white leading-tight">AZ-AutoClean</h1>
                            <p class="text-[10px] text-slate-400">${appState.currentUser.name} (${roleBadge})</p>
                        </div>
                    </div>
                    <div class="flex items-center space-x-2">
                        <button onclick="openActionMenu()" class="bg-gradient-to-r from-blue-600 to-sky-500 text-white p-2.5 rounded-xl text-xs shadow-md shadow-blue-500/20" title="Actions Rapides">
                            <i class="fa-solid fa-bolt text-sm"></i>
                        </button>
                        <button onclick="logoutUser()" class="bg-slate-800 hover:bg-slate-700 text-rose-400 p-2.5 rounded-xl text-xs" title="Déconnexion">
                            <i class="fa-solid fa-power-off text-sm"></i>
                        </button>
                    </div>
                </header>
            `;
        }

        function renderBottomNav() {
            if (!appState.currentUser) return '';
            const isAdmin = appState.currentUser.role === 'admin';
            const v = appState.currentView;

            return `
                <nav class="bg-slate-900/95 backdrop-blur border-t border-slate-800 fixed bottom-0 left-0 right-0 max-w-md mx-auto z-40 px-3 py-2 flex items-center justify-around shadow-2xl">
                    <button onclick="appState.currentView='home'; renderApp();" class="flex flex-col items-center py-1 px-3 rounded-xl transition-colors ${v === 'home' ? 'text-sky-400 font-bold' : 'text-slate-400 hover:text-slate-200'}">
                        <i class="fa-solid fa-house text-lg mb-0.5"></i>
                        <span class="text-[10px]">Accueil</span>
                    </button>
                    <button onclick="appState.currentView='clients'; renderApp();" class="flex flex-col items-center py-1 px-3 rounded-xl transition-colors ${v === 'clients' ? 'text-sky-400 font-bold' : 'text-slate-400 hover:text-slate-200'}">
                        <i class="fa-solid fa-car-side text-lg mb-0.5"></i>
                        <span class="text-[10px]">Plaques</span>
                    </button>
                    <button onclick="appState.currentView='pos'; renderApp();" class="flex flex-col items-center py-1 px-3 rounded-xl transition-colors ${v === 'pos' ? 'text-sky-400 font-bold' : 'text-slate-400 hover:text-slate-200'}">
                        <i class="fa-solid fa-boxes-stacked text-lg mb-0.5"></i>
                        <span class="text-[10px]">Produits</span>
                    </button>
                    <button onclick="appState.currentView='journal'; renderApp();" class="flex flex-col items-center py-1 px-3 rounded-xl transition-colors ${v === 'journal' ? 'text-sky-400 font-bold' : 'text-slate-400 hover:text-slate-200'}">
                        <i class="fa-solid fa-clock-rotate-left text-lg mb-0.5"></i>
                        <span class="text-[10px]">Journal</span>
                    </button>
                    ${isAdmin ? `
                        <button onclick="appState.currentView='admin'; renderApp();" class="flex flex-col items-center py-1 px-3 rounded-xl transition-colors ${v === 'admin' ? 'text-amber-400 font-bold' : 'text-slate-400 hover:text-slate-200'}">
                            <i class="fa-solid fa-shield-halved text-lg mb-0.5"></i>
                            <span class="text-[10px]">Admin</span>
                        </button>
                    ` : ''}
                </nav>
            `;
        }

        // ==========================================
        // 6. MENU ACTIONS RAPIDES STATION
        // ==========================================
        function openActionMenu() {
            const isCashier = appState.currentUser && appState.currentUser.role === 'cashier';
            openCustomModal(`
                <div class="space-y-4">
                    <div class="flex items-center justify-between border-b border-slate-800 pb-2.5">
                        <h3 class="font-bold text-white text-base">⚡ Actions Rapides Station</h3>
                        <button onclick="closeModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
                    </div>
                    <div class="grid grid-cols-2 gap-2.5">
                        <button onclick="closeModal(); openPlateScannerModal();" class="bg-slate-800 hover:bg-slate-700 text-sky-400 p-3 rounded-2xl flex flex-col items-center text-center space-y-1.5 transition-all">
                            <i class="fa-solid fa-camera text-lg"></i>
                            <span class="text-xs font-semibold">Scanner Plaque</span>
                        </button>
                        <button onclick="closeModal(); openProductScannerModal();" class="bg-slate-800 hover:bg-slate-700 text-emerald-400 p-3 rounded-2xl flex flex-col items-center text-center space-y-1.5 transition-all">
                            <i class="fa-solid fa-barcode text-lg"></i>
                            <span class="text-xs font-semibold">Scanner Produit</span>
                        </button>
                        <button onclick="closeModal(); appState.currentView='pos'; renderApp();" class="bg-slate-800 hover:bg-slate-700 text-amber-400 p-3 rounded-2xl flex flex-col items-center text-center space-y-1.5 transition-all">
                            <i class="fa-solid fa-cash-register text-lg"></i>
                            <span class="text-xs font-semibold">Caisse & Vente</span>
                        </button>
                        ${!isCashier ? `
                            <button onclick="closeModal(); openAddClientModal();" class="bg-slate-800 hover:bg-slate-700 text-purple-400 p-3 rounded-2xl flex flex-col items-center text-center space-y-1.5 transition-all">
                                <i class="fa-solid fa-user-plus text-lg"></i>
                                <span class="text-xs font-semibold">Nouveau Client</span>
                            </button>
                        ` : `
                            <div class="bg-slate-950 border border-slate-900 p-3 rounded-2xl flex flex-col items-center justify-center text-center opacity-50">
                                <i class="fa-solid fa-ban text-slate-500 text-lg mb-1"></i>
                                <span class="text-[10px] text-slate-400">Création client restreinte</span>
                            </div>
                        `}
                    </div>
                </div>
            `);
        }

        // ==========================================
        // 7. ÉCRAN D'ACCUEIL
        // ==========================================
        function renderHomeView() {
            const totalPassagesToday = appState.passages.length;
            const caTotal = appState.passages.reduce((sum, p) => sum + p.totalAmount, 0);
            const isCashier = appState.currentUser && appState.currentUser.role === 'cashier';

            return `
                <div class="p-4 space-y-5 pb-24">
                    <!-- Carte Résumé Station -->
                    <div class="bg-gradient-to-br from-blue-900/40 via-slate-900 to-slate-900 border border-blue-500/20 rounded-3xl p-5 shadow-xl relative overflow-hidden">
                        <div class="absolute -right-6 -bottom-6 w-32 h-32 bg-blue-500/10 rounded-full blur-2xl pointer-events-none"></div>
                        <div class="flex items-center justify-between mb-4">
                            <div>
                                <p class="text-xs font-medium text-blue-300">Chiffre d'Affaires Global</p>
                                <h2 class="text-2xl font-black text-white mt-0.5">${caTotal.toLocaleString()} <span class="text-sm font-semibold text-sky-400">DA</span></h2>
                            </div>
                            <div class="bg-blue-600/20 border border-blue-500/30 px-3 py-1.5 rounded-xl text-xs font-bold text-sky-300">
                                ${totalPassagesToday} Interventions
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-2 pt-2 border-t border-slate-800/80">
                            <button onclick="openPlateScannerModal()" class="bg-blue-600 hover:bg-blue-500 text-white font-semibold py-2.5 px-3 rounded-xl text-xs flex items-center justify-center space-x-2 transition-all shadow-md shadow-blue-600/20">
                                <i class="fa-solid fa-camera"></i>
                                <span>Scanner Plaque</span>
                            </button>
                            <button onclick="openProductScannerModal()" class="bg-slate-800 hover:bg-slate-700 text-sky-300 font-semibold py-2.5 px-3 rounded-xl text-xs flex items-center justify-center space-x-2 transition-all">
                                <i class="fa-solid fa-barcode"></i>
                                <span>Scan Produit</span>
                            </button>
                        </div>
                    </div>

                    <!-- Véhicules nécessitant une vidange (Alertes) -->
                    <div class="space-y-3">
                        <div class="flex items-center justify-between">
                            <h3 class="text-xs font-bold uppercase tracking-wider text-amber-400 flex items-center">
                                <i class="fa-solid fa-triangle-exclamation mr-1.5"></i> Alertes Vidanges & Entretiens
                            </h3>
                            <button onclick="appState.currentView='clients'; renderApp();" class="text-xs text-sky-400 font-semibold hover:underline">Voir tout</button>
                        </div>
                        <div class="space-y-2.5">
                            ${appState.vehicles.map(v => {
                                const diff = v.nextOilMileage - v.mileage;
                                const isUrgent = diff <= 1000;
                                return `
                                    <div class="bg-slate-900 border ${isUrgent ? 'border-amber-500/40' : 'border-slate-800'} rounded-2xl p-3.5 flex items-center justify-between">
                                        <div class="pr-2">
                                            <div class="flex items-center space-x-2">
                                                <span class="font-mono bg-slate-950 text-sky-400 font-bold text-xs px-2 py-0.5 rounded border border-slate-800">${v.plate}</span>
                                                <span class="text-xs font-semibold text-white">${v.brandModel}</span>
                                            </div>
                                            <p class="text-[11px] text-slate-400 mt-1">Propriétaire : ${v.owner} • ${v.mileage.toLocaleString()} km</p>
                                        </div>
                                        <div class="text-right">
                                            <span class="text-[11px] font-bold px-2.5 py-1 rounded-xl ${isUrgent ? 'bg-amber-500/20 text-amber-300 border border-amber-500/30' : 'bg-slate-800 text-slate-300'}">
                                                Reste ${diff.toLocaleString()} km
                                            </span>
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>

                    <!-- Actions Rapides Accueil -->
                    <div class="grid grid-cols-2 gap-3">
                        <button onclick="appState.currentView='pos'; renderApp();" class="bg-slate-900 border border-slate-800 hover:border-slate-700 p-4 rounded-2xl text-left space-y-2 transition-all">
                            <div class="w-9 h-9 bg-emerald-500/10 text-emerald-400 rounded-xl flex items-center justify-center text-sm">
                                <i class="fa-solid fa-cash-register"></i>
                            </div>
                            <h4 class="font-bold text-xs text-white">Encaissement & POS</h4>
                            <p class="text-[10px] text-slate-400">Vente de produits & services de lavage</p>
                        </button>
                        ${!isCashier ? `
                            <button onclick="openAddClientModal()" class="bg-slate-900 border border-slate-800 hover:border-slate-700 p-4 rounded-2xl text-left space-y-2 transition-all">
                                <div class="w-9 h-9 bg-purple-500/10 text-purple-400 rounded-xl flex items-center justify-center text-sm">
                                    <i class="fa-solid fa-user-plus"></i>
                                </div>
                                <h4 class="font-bold text-xs text-white">Nouveau Client</h4>
                                <p class="text-[10px] text-slate-400">Enregistrer un véhicule & propriétaire</p>
                            </button>
                        ` : `
                            <div class="bg-slate-900/50 border border-slate-800 p-4 rounded-2xl text-left space-y-2 opacity-60">
                                <div class="w-9 h-9 bg-slate-800 text-slate-500 rounded-xl flex items-center justify-center text-sm">
                                    <i class="fa-solid fa-ban"></i>
                                </div>
                                <h4 class="font-bold text-xs text-slate-400">Ajout Restreint</h4>
                                <p class="text-[10px] text-slate-500">Droits caissier limités</p>
                            </div>
                        `}
                    </div>
                </div>
            `;
        }

        // ==========================================
        // 8. MODULE CAMÉRA : SCANNER PLAQUE (LIVE)
        // ==========================================
        function openPlateScannerModal() {
            openCustomModal(`
                <div class="space-y-4">
                    <div class="flex items-center justify-between border-b border-slate-800 pb-2.5">
                        <h3 class="font-bold text-white text-sm flex items-center">
                            <i class="fa-solid fa-camera mr-2 text-sky-400"></i> Scanner Plaque d'Immatriculation
                        </h3>
                        <button onclick="closeCameraAndModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
                    </div>

                    <div class="relative w-full h-56 bg-black rounded-2xl overflow-hidden border border-slate-800 flex items-center justify-center">
                        <video id="plate-video" autoplay playsinline muted class="absolute inset-0 w-full h-full object-cover"></video>

        let activeStream = null;

        function initCameraStream(videoId) {
            const videoElement = document.getElementById(videoId);
            if (!videoElement) return;

            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
                    .then(stream => {
                        activeStream = stream;
                        videoElement.srcObject = stream;
                    })
                    .catch(err => {
                        console.warn("Caméra non accessible ou refusée :", err);
                        // Fallback visuel si la caméra est bloquée
                        const parent = videoElement.parentElement;
                        if (parent) {
                            parent.innerHTML = `
                                <div class="flex flex-col items-center justify-center h-full text-center p-4">
                                    <i class="fa-solid fa-camera-slash text-2xl text-slate-500 mb-2"></i>
                                    <p class="text-xs text-slate-400">Caméra non disponible (Autorisation requise).</p>
                                    <p class="text-[10px] text-slate-500 mt-1">Utilisez les boutons de simulation ci-dessous.</p>
                                </div>
                            `;
                        }
                    });
            }
        }

        function stopCameraStream() {
            if (activeStream) {
                activeStream.getTracks().forEach(track => track.stop());
                activeStream = null;
            }
        }

        function closeCameraAndModal() {
            stopCameraStream();
            closeModal();
        }

            closeModal();
            const vehicle = appState.vehicles.find(v => v.plate === plate);

                appState.currentView = 'clients';
                renderApp();
                showMessage(`Véhicule ${vehicle.brandModel} (${vehicle.plate}) reconnu avec succès !`, "Plaque Identifiée");
            } else {
                showMessage(`Plaque ${plate} non trouvée dans la base.`, "Reconnaissance Plaque");
            }
        }

        function simulateProductScanned(barcode) {
            closeModal();
            const product = appState.catalog.find(p => p.barcode === barcode);
            if (product) {
                const existing = appState.posCart.find(i => i.id === product.id);
                if (existing) {
                    existing.qty += 1;

                }
                appState.currentView = 'pos';
                renderApp();
                showMessage(`Article "${product.name}" ajouté au panier !`, "Scan Réussi");
            } else {
                showMessage(`Code-barres ${barcode} inconnu.`, "Scan Produit");
            }
        }

        function addToCart(itemId) {
            const item = appState.catalog.find(c => c.id === itemId);
            if (!item) return;

            if (item.type === 'product' && item.stock <= 0) {
                showMessage(`Stock épuisé pour ${item.name}.`, "Stock Insuffisant");
                return;
            }

            const existing = appState.posCart.find(i => i.id === itemId);
            if (existing) {
                if (item.type === 'product' && existing.qty >= item.stock) {
                    showMessage("Stock maximum atteint pour cet article.", "Stock Limité");
                    return;
                }
                existing.qty += 1;
            } else {
                appState.posCart.push({ ...item, qty: 1 });
            }
            renderApp();
        }

        function updateCartQty(itemId, delta) {
            const index = appState.posCart.findIndex(i => i.id === itemId);
            if (index !== -1) {
                appState.posCart[index].qty += delta;
                if (appState.posCart[index].qty <= 0) {
                    appState.posCart.splice(index, 1);
                }
                renderApp();
            }
        }

                                <div>
                                    <span class="font-mono text-sky-400 font-bold text-xs">${v.plate}</span>
                                    <p class="text-xs font-semibold text-white">${v.brandModel} (${v.owner})</p>
                                </div>
                                <i class="fa-solid fa-chevron-right text-slate-600 text-xs"></i>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `);
        }

        function checkoutCart() {
            if (appState.posCart.length === 0) return;

            const vehicle = appState.vehicles.find(v => v.id === appState.selectedVehicleId);
            const clientName = vehicle ? vehicle.owner : 'Client de Passage';
            const plate = vehicle ? vehicle.plate : 'SANS-IMMAT';
            const totalAmount = appState.posCart.reduce((sum, i) => sum + (i.price * i.qty), 0);
            const itemsSummary = appState.posCart.map(i => `${i.name} (x${i.qty})`);

            // Décrémenter les stocks produits
            appState.posCart.forEach(cartItem => {
                const catItem = appState.catalog.find(c => c.id === cartItem.id);
                if (catItem && catItem.type === 'product') {
                    catItem.stock = Math.max(0, catItem.stock - cartItem.qty);
                }
            });

            // Enregistrer dans le journal
            appState.passages.unshift({
                id: Date.now(),
                clientName,
                plate,
                employeeName: appState.currentUser.name,
                items: itemsSummary,
                totalAmount,
                date: new Date().toLocaleString('fr-FR', { dateStyle: 'short', timeStyle: 'short' })
            });

            appState.posCart = [];
            appState.selectedVehicleId = null;
            saveState();
            renderApp();
            showMessage(`Paiement de ${totalAmount.toLocaleString()} DA validé avec succès !`, "Encaissement Réussi");
        }

        // ==========================================
        // 12. JOURNAL & ACTIVITÉ (ONGLET JOURNAL)
        // ==========================================
        function renderJournalView() {
            return `
                <div class="p-4 space-y-4 pb-24">
                    <div>
                        <h2 class="text-base font-bold text-white">Journal d'Activité & Passages</h2>
                        <p class="text-xs text-slate-400">Historique des prestations par employé et client</p>
                    </div>

                    <div class="space-y-2.5">
                        ${appState.passages.length === 0 ? `<p class="text-xs text-slate-500 text-center py-8">Aucun passage enregistré.</p>` : 
                            appState.passages.map(p => `
                                <div class="bg-slate-900 border border-slate-800 rounded-2xl p-3.5 space-y-2">
                                    <div class="flex items-center justify-between">
                                        <div class="flex items-center space-x-2">
                                            <span class="font-mono bg-slate-950 text-sky-400 font-bold text-xs px-2 py-0.5 rounded border border-slate-800">${p.plate}</span>
                                            <span class="font-bold text-xs text-white">${p.clientName}</span>
                                        </div>
                                        <span class="font-black text-emerald-400 text-xs">${p.totalAmount.toLocaleString()} DA</span>
                                    </div>
                                    <div class="text-[11px] text-slate-300 bg-slate-950/60 p-2 rounded-xl border border-slate-800/80 space-y-0.5">
                                        <p class="font-medium text-slate-200">Prestations : ${p.items.join(', ')}</p>
                                        <div class="flex justify-between text-[10px] text-slate-400 pt-1 border-t border-slate-800/50">
                                            <span>Employé : <strong class="text-amber-300">${p.employeeName}</strong></span>
                                            <span>${p.date}</span>
                                        </div>
                                    </div>
                                </div>
                            `).join('')
                        }
                    </div>
                </div>
            `;
        }

        // ==========================================
        // 13. ESPACE ADMINISTRATEUR
        // ==========================================
        function renderAdminView() {
            if (!appState.currentUser || appState.currentUser.role !== 'admin') {
                return `<div class="p-6 text-center text-rose-400 text-sm">Accès réservé à l'administrateur.</div>`;
            }

            return `
                <div class="p-4 space-y-5 pb-24">
                    <div class="flex items-center justify-between">
                        <div>
                            <h2 class="text-base font-bold text-white">Espace Administrateur</h2>
                            <p class="text-xs text-slate-400">Équipe, accès PIN, historique & tarifs</p>
                        </div>
                        <button onclick="openAddUserModal()" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-xs px-3 py-2 rounded-xl flex items-center">
                            <i class="fa-solid fa-user-plus mr-1.5"></i> Employé
                        </button>
                    </div>

                    <!-- Gestion des Employés & Suivi d'activité -->
                    <div class="space-y-3">
                        <h3 class="text-xs font-bold uppercase tracking-wider text-amber-400">Équipe & Suivi d'activité</h3>
                        ${appState.users.map(u => {
                            const empPassages = appState.passages.filter(p => p.employeeName === u.name);
                            const empTotal = empPassages.reduce((s, p) => s + p.totalAmount, 0);
                            const roleBadge = u.role === 'admin' ? 'Admin' : (u.role === 'cashier' ? 'Caissier' : 'Lavagiste');
                            return `
                                <div class="bg-slate-900 border border-slate-800 rounded-2xl p-3.5 space-y-2.5">
                                    <div class="flex items-center justify-between">
                                        <div>
                                            <div class="flex items-center space-x-2">
                                                <span class="font-bold text-sm text-white">${u.name}</span>
                                                <span class="text-[10px] px-2 py-0.5 rounded bg-slate-800 text-slate-300 uppercase">${roleBadge}</span>
                                            </div>
                                            <p class="text-[11px] text-slate-400 mt-0.5">PIN : <span class="font-mono text-amber-300">${u.pin}</span> • CA généré : <strong class="text-emerald-400">${empTotal.toLocaleString()} DA</strong></p>
                                        </div>
                                        <div class="flex space-x-1.5">
                                            <button onclick="openChangePinModal(${u.id})" title="Modifier PIN" class="bg-slate-800 hover:bg-slate-700 text-amber-300 px-2.5 py-1.5 rounded-xl text-xs">
                                                <i class="fa-solid fa-key"></i>
                                            </button>
                                            <button onclick="openEmployeeHistoryModal('${u.name}')" title="Historique travail" class="bg-blue-600/20 hover:bg-blue-600/30 text-blue-300 px-2.5 py-1.5 rounded-xl text-xs font-semibold">
                                                Détails (${empPassages.length})
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>

                    <!-- Gestion Tarifs & Stocks -->
                    <div class="space-y-2.5">
                        <div class="flex items-center justify-between">
                            <h3 class="text-xs font-bold uppercase tracking-wider text-sky-400">Tarifs & Stocks Catalogue</h3>
                            <button onclick="openAddCatalogItemModal()" class="text-xs text-sky-400 font-semibold">+ Ajouter</button>
                        </div>
                        <div class="space-y-2">
                            ${appState.catalog.map(item => `
                                <div class="bg-slate-900/70 border border-slate-800 rounded-2xl p-3 flex items-center justify-between">
                                    <div class="pr-2">
                                        <p class="text-xs font-semibold text-white">${item.name}</p>
                                        <p class="text-[10px] text-slate-400">${item.type === 'product' ? 'Produit' : 'Service'} • ${item.barcode || ''}</p>
                                    </div>
                                    <div class="flex items-center space-x-2">
                                        <input type="number" value="${item.price}" onchange="updateCatalogPrice(${item.id}, this.value)"
                                            class="w-20 bg-slate-950 border border-slate-800 rounded-lg px-2 py-1 text-xs text-right text-sky-300 font-bold">
                                        ${item.type === 'product' ? `
                                            <input type="number" value="${item.stock}" onchange="updateCatalogStock(${item.id}, this.value)"
                                                class="w-14 bg-slate-950 border border-slate-800 rounded-lg px-2 py-1 text-xs text-center text-emerald-300">
                                        ` : ''}
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <!-- Bouton Réinitialisation -->
                    <div class="pt-2">
                        <button onclick="resetState()" class="w-full bg-rose-500/10 hover:bg-rose-500/20 border border-rose-500/30 text-rose-400 font-semibold py-3 rounded-xl text-xs">
                            Réinitialiser toutes les données démo
                        </button>
                    </div>
                </div>
            `;
        }

        function updateCatalogPrice(id, val) {
            const item = appState.catalog.find(c => c.id === id);
            if (item) {
                item.price = parseInt(val) || 0;
                saveState();
            }
        }

        function updateCatalogStock(id, val) {
            const item = appState.catalog.find(c => c.id === id);
            if (item && item.type === 'product') {
                item.stock = parseInt(val) || 0;
                saveState();
            }
        }

        function openAddUserModal() {
            openCustomModal(`
                <form onsubmit="saveNewUser(event)" class="space-y-3.5">
                    <div class="flex items-center justify-between">
                        <h3 class="font-bold text-white text-base">Ajouter un Employé</h3>
                        <button type="button" onclick="closeModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
                    </div>
                    <div>
                        <label class="text-xs text-slate-400 block mb-1">Nom & Prénom</label>
                        <input type="text" id="new-emp-name" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-xs text-white">
                    </div>
                    <div>
                        <label class="text-xs text-slate-400 block mb-1">Rôle</label>
                        <select id="new-emp-role" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-xs text-white">
                            <option value="washer">Lavagiste / Mécano</option>
                            <option value="cashier">Caissier (Ajout client restreint)</option>
                            <option value="admin">Administrateur</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-xs text-slate-400 block mb-1">Code PIN (4 chiffres)</label>
                        <input type="text" id="new-emp-pin" maxlength="6" required placeholder="2222" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-xs text-white">
                    </div>
                    <button type="submit" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-3 rounded-xl text-xs">
                        Créer le compte employé
                    </button>
                </form>
            `);
        }

        function saveNewUser(e) {
            e.preventDefault();
            const name = document.getElementById('new-emp-name').value.trim();
            const role = document.getElementById('new-emp-role').value;
            const pin = document.getElementById('new-emp-pin').value.trim();
            appState.users.push({ id: Date.now(), name, role, pin, active: true });
            saveState();
            closeModal();
            renderApp();
        }

        function openChangePinModal(userId) {
            const user = appState.users.find(u => u.id === userId);
            if (!user) return;
            openCustomModal(`
                <form onsubmit="saveUserPin(event, ${user.id})" class="space-y-3.5">
                    <div class="flex items-center justify-between">
                        <h3 class="font-bold text-white text-base">Modifier PIN - ${user.name}</h3>
                        <button type="button" onclick="closeModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
                    </div>
                    <div>
                        <label class="text-xs text-slate-400 block mb-1">Nouveau Code PIN</label>
                        <input type="text" id="update-emp-pin" value="${user.pin}" maxlength="6" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-center text-base tracking-widest text-white">
                    </div>
                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3 rounded-xl text-xs">
                        Enregistrer le nouveau PIN
                    </button>
                </form>
            `);
        }

        function saveUserPin(e, userId) {
            e.preventDefault();
            const user = appState.users.find(u => u.id === userId);
            if (user) {
                user.pin = document.getElementById('update-emp-pin').value.trim();
                saveState();
            }
            closeModal();
            renderApp();
        }

        function openEmployeeHistoryModal(employeeName) {
            const logs = appState.passages.filter(p => p.employeeName === employeeName);
            const total = logs.reduce((s, p) => s + p.totalAmount, 0);

            openCustomModal(`
                <div class="space-y-3.5">
                    <div class="flex items-center justify-between border-b border-slate-800 pb-2.5">
                        <div>
                            <h3 class="font-bold text-white text-sm">Historique : ${employeeName}</h3>
                            <p class="text-[11px] text-emerald-400 font-semibold">Total encaissé : ${total.toLocaleString()} DA</p>
                        </div>
                        <button onclick="closeModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
                    </div>

                    ${logs.length === 0 ? `<p class="text-xs text-slate-400 text-center py-4">Aucune intervention enregistrée pour cet employé.</p>` : `
                        <div class="space-y-2 max-h-80 overflow-y-auto">
                            ${logs.map(l => `
                                <div class="bg-slate-950 border border-slate-800 rounded-xl p-2.5 space-y-1">
                                    <div class="flex justify-between text-xs">
                                        <span class="font-bold text-white">Client : ${l.clientName}</span>
                                        <span class="text-emerald-400 font-bold">${l.totalAmount.toLocaleString()} DA</span>
                                    </div>
                                    <p class="text-[10px] text-slate-400">${l.date}</p>
                                    <p class="text-[11px] text-slate-300">${l.items.join(', ')}</p>
                                </div>
                            `).join('')}
                        </div>
                    `}
                </div>
            `);
        }

        function openAddCatalogItemModal() {
            openCustomModal(`
                <form onsubmit="saveNewCatalogItem(event)" class="space-y-3.5">
                    <div class="flex items-center justify-between border-b border-slate-800 pb-2.5">
                        <h3 class="font-bold text-white text-sm">Ajouter un Article / Service</h3>
                        <button type="button" onclick="closeModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
                    </div>
                    <div>
                        <label class="text-xs text-slate-400 block mb-1">Nom de l'article</label>
                        <input type="text" id="cat-item-name" required placeholder="Filtre à air..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-xs text-white">
                    </div>
                    <div>
                        <label class="text-xs text-slate-400 block mb-1">Type</label>
                        <select id="cat-item-type" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-xs text-white">
                            <option value="product">Produit (Stock géré)</option>
                            <option value="service">Service (Lavage / Vidange)</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-xs text-slate-400 block mb-1">Prix (DA)</label>
                        <input type="number" id="cat-item-price" required placeholder="1500" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-xs text-white">
                    </div>
                    <div>
                        <label class="text-xs text-slate-400 block mb-1">Stock Initial (si produit)</label>
                        <input type="number" id="cat-item-stock" value="10" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-xs text-white">
                    </div>
                    <button type="submit" class="w-full bg-sky-500 hover:bg-sky-400 text-slate-950 font-bold py-3 rounded-xl text-xs">
                        Ajouter au catalogue
                    </button>
                </form>
            `);
        }

        function saveNewCatalogItem(e) {
            e.preventDefault();
            const name = document.getElementById('cat-item-name').value.trim();
            const type = document.getElementById('cat-item-type').value;
            const price = parseInt(document.getElementById('cat-item-price').value) || 0;
            const stock = parseInt(document.getElementById('cat-item-stock').value) || 0;

            appState.catalog.push({
                id: Date.now(),
                name, type, price, stock,
                barcode: 'BC' + Math.floor(10000000 + Math.random() * 90000000)
            });

            saveState();
            closeModal();
            renderApp();
            showMessage("Article ajouté au catalogue avec succès !", "Succès");
        }

        // ==========================================
        // 14. BOUCLE DE RENDU PRINCIPALE
        // ==========================================
        function renderApp() {
            const root = document.getElementById('app');
            if (!root) return;

            if (!appState.currentUser) {
                root.innerHTML = renderLoginView();
                return;
            }

            let viewHtml = '';
            switch (appState.currentView) {
                case 'pos':
                    viewHtml = renderPosView();
                    break;
                case 'journal':
                    viewHtml = renderJournalView();
                    break;
                case 'clients':
                    viewHtml = renderClientsView();
                    break;
                case 'admin':
                    viewHtml = renderAdminView();
                    break;
                case 'home':
                default:
                    viewHtml = renderHomeView();
                    break;
            }

            root.innerHTML = `
                ${renderHeader()}
                <main class="flex-1 overflow-y-auto no-scrollbar">
                    ${viewHtml}
                </main>
                ${renderBottomNav()}
            `;
        }

        // Initialisation au chargement
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', renderApp);
        } else {
            renderApp();
        }
    </script>
</body>
</html>
